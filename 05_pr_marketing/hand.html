<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真耶穌教會傳教百年西區音樂會 - 現場舉手牌產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #050b14;
            color: #f3f4f6;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #fff8cb 0%, #e5c158 40%, #c99a22 80%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Perspective and Flip Card Effect */
        .card-container {
            perspective: 1200px;
        }

        .flipper {
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            position: relative;
        }

        .flipper.flipped {
            transform: rotateY(180deg);
        }

        .front, .back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .back {
            transform: rotateY(180deg);
        }

        /* Pop Art Cartoon Text Stroke Effect */
        .text-stroke-pop {
            -webkit-text-stroke: 10px #0b192c;
            paint-order: stroke fill;
            text-shadow: 0 8px 0px rgba(0, 0, 0, 0.25);
        }

        .text-stroke-pop-gold {
            -webkit-text-stroke: 10px #3d2300;
            paint-order: stroke fill;
            text-shadow: 0 8px 0px rgba(0, 0, 0, 0.25);
        }

        /* SVG Die-Cut Outline Effect */
        .sign-diecut-shadow {
            filter: drop-shadow(0px 18px 25px rgba(0, 0, 0, 0.5));
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #081120;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e3a8a;
            border-radius: 3px;
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
            }
            header, .controls-area, footer, .no-print {
                display: none !important;
            }
            .print-area {
                display: block !important;
                width: 100% !important;
            }
            .sign-card {
                page-break-after: always;
                box-shadow: none !important;
                margin: 0 auto !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6">

    <!-- Header -->
    <header class="w-full max-w-7xl text-center mb-6">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs md:text-sm tracking-widest mb-2">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            真耶穌教會臺灣傳教百週年 ‧ 西區音樂會現場接待組
        </div>
        <h1 class="text-2xl md:text-4xl font-black tracking-wider gold-gradient-text">
            工作人員手持舉手牌 / 告示牌產生器
        </h1>
        <p class="text-xs md:text-sm text-gray-400 mt-1.5 max-w-2xl mx-auto">
            專為現場引導與秩序維護設計之雙面手持牌，包含「請跟我來」、「請勿飲食」、「請勿大聲喧嘩」等必備標語。
        </p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- Controls Panel (Left 5 cols) -->
        <div class="controls-area lg:col-span-5 bg-[#112240] border border-blue-900/50 p-5 md:p-6 rounded-2xl shadow-2xl space-y-5">
            <div class="flex items-center justify-between border-b border-blue-900/60 pb-3">
                <h2 class="text-base font-bold text-amber-200 flex items-center gap-2">
                    <span>🪧</span>
                    <span>選擇舉手牌套組或自訂標語</span>
                </h2>
                <span class="text-[11px] bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-full border border-amber-500/30">現場接待維護專用</span>
            </div>

            <!-- Quick Preset Selector Buttons -->
            <div class="space-y-3">
                <label class="block text-xs uppercase font-bold text-gray-300">1. 快速選擇指定三大舉牌組合：</label>
                
                <div class="grid grid-cols-1 gap-2.5">
                    <!-- Preset 1 -->
                    <button onclick="selectPreset('follow')" id="btnPresetFollow" class="preset-btn bg-amber-500 text-slate-950 font-black p-3 rounded-xl transition border border-amber-400 shadow flex items-center justify-between hover:brightness-110">
                        <div class="text-left">
                            <div class="text-xs font-bold">第一組：隊伍引導</div>
                            <div class="text-[11px] opacity-90 font-mono">正面「請跟我來」 ｜ 反面「請跟我來」</div>
                        </div>
                        <span class="text-lg">🚩</span>
                    </button>

                    <!-- Preset 2 -->
                    <button onclick="selectPreset('food')" id="btnPresetFood" class="preset-btn bg-[#081120] text-gray-300 hover:text-white font-bold p-3 rounded-xl transition border border-blue-900 flex items-center justify-between">
                        <div class="text-left">
                            <div class="text-xs font-bold text-amber-300">第二組：會場秩序與飲食限制</div>
                            <div class="text-[11px] text-gray-400 font-mono">正面「請勿飲食」 ｜ 反面「請勿任意走動」</div>
                        </div>
                        <span class="text-lg">🥤</span>
                    </button>

                    <!-- Preset 3 -->
                    <button onclick="selectPreset('quiet')" id="btnPresetQuiet" class="preset-btn bg-[#081120] text-gray-300 hover:text-white font-bold p-3 rounded-xl transition border border-blue-900 flex items-center justify-between">
                        <div class="text-left">
                            <div class="text-xs font-bold text-amber-300">第三組：保持安靜與禮儀</div>
                            <div class="text-[11px] text-gray-400 font-mono">正面「請勿大聲喧嘩」 ｜ 反面「請輕聲細語」</div>
                        </div>
                        <span class="text-lg">🤫</span>
                    </button>
                </div>
            </div>

            <!-- Manual Custom Inputs -->
            <div class="space-y-3 pt-2 border-t border-blue-900/60">
                <label class="block text-xs uppercase font-bold text-gray-300">2. 自訂當前舉手牌標語內容：</label>

                <div>
                    <label class="block text-xs tracking-wider text-amber-300 mb-1 font-bold">正面標語 (Front)</label>
                    <input type="text" id="inFrontText" value="請跟我來" class="w-full bg-[#081120] border border-blue-900/80 rounded-xl px-3.5 py-2.5 text-xs text-white font-bold focus:outline-none focus:border-amber-400 transition">
                </div>

                <div>
                    <label class="block text-xs tracking-wider text-amber-300 mb-1 font-bold">反面標語 (Back)</label>
                    <input type="text" id="inBackText" value="請跟我來" class="w-full bg-[#081120] border border-blue-900/80 rounded-xl px-3.5 py-2.5 text-xs text-white font-bold focus:outline-none focus:border-amber-400 transition">
                </div>

                <div>
                    <label class="block text-xs tracking-wider text-gray-400 mb-1">主題色風格調配</label>
                    <select id="colorThemeSelect" onchange="changeColorTheme(this.value)" class="w-full bg-[#081120] border border-blue-900/80 rounded-xl px-3 py-2 text-xs text-amber-200 font-bold focus:outline-none focus:border-amber-400 transition">
                        <option value="gold">聖宴黃金調 (黃底白字黑邊 + 尊榮金)</option>
                        <option value="amber">警示鮮黃調 (鮮黃底亮白字 + 爆發星)</option>
                        <option value="navy">典雅深藍調 (深藍底金字 + 華麗風)</option>
                    </select>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-3 space-y-2">
                <button onclick="toggleFlipCard()" class="w-full bg-gradient-to-r from-amber-500 via-amber-400 to-amber-600 text-slate-950 font-black py-3 px-4 rounded-xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2 hover:brightness-110">
                    <span>🔄</span>
                    <span>翻轉觀看正 / 反面 (Flip Card)</span>
                </button>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="downloadSignImage('front')" class="bg-[#1d3557] hover:bg-[#284b63] text-amber-300 font-bold py-2.5 px-3 rounded-xl border border-blue-800 transition text-xs flex items-center justify-center gap-1.5">
                        <span>📥</span>
                        <span>下載正面高清圖</span>
                    </button>
                    <button onclick="downloadSignImage('back')" class="bg-[#1d3557] hover:bg-[#284b63] text-amber-300 font-bold py-2.5 px-3 rounded-xl border border-blue-800 transition text-xs flex items-center justify-center gap-1.5">
                        <span>📥</span>
                        <span>下載反面高清圖</span>
                    </button>
                </div>

                <button onclick="downloadDiecutSVG()" class="w-full bg-[#4a044e] hover:bg-[#701a75] text-fuchsia-300 font-bold py-3 px-4 rounded-xl border border-fuchsia-800 transition text-xs flex items-center justify-center gap-1.5 shadow-md">
                    <span>✂️</span>
                    <span>下載刀模割型向量檔 (Die-cut SVG)</span>
                </button>

                <button onclick="window.print()" class="w-full bg-[#0c1b33] hover:bg-[#112240] text-gray-300 font-bold py-2 px-4 rounded-xl border border-blue-900 transition text-xs flex items-center justify-center gap-1">
                    <span>🖨️</span>
                    <span>列印 / 存為印刷 PDF (A4 尺寸輸出)</span>
                </button>
            </div>
        </div>

        <!-- Right Preview Canvas Area (Right 7 cols) -->
        <div class="lg:col-span-7 flex flex-col items-center">
            
            <!-- Controls & Flip Indicator Header -->
            <div class="w-full max-w-[500px] flex justify-between items-center mb-3 no-print">
                <div class="text-xs uppercase tracking-widest text-amber-400/90 font-mono flex items-center gap-1.5">
                    <span>🖼️ 舉手牌實體卡板造型預覽</span>
                    <span id="sideLabel" class="bg-amber-500/20 text-amber-300 text-[10px] px-2 py-0.5 rounded border border-amber-500/40">目前顯示：正面</span>
                </div>

                <button onclick="toggleFlipCard()" class="text-xs text-amber-300 hover:text-amber-100 font-bold flex items-center gap-1 bg-blue-950/80 px-3 py-1 rounded-full border border-blue-800 transition">
                    <span>🔄 翻面觀看</span>
                </button>
            </div>

            <!-- Card Flip Stage Container -->
            <div class="card-container w-full max-w-[500px] aspect-[4/4.5] flex justify-center items-center">
                
                <div id="cardFlipper" class="flipper w-full h-full">
                    
                    <!-- FRONT SIDE -->
                    <div id="signCardFront" class="front sign-card flex flex-col items-center justify-center p-2 select-none">
                        
                        <div class="sign-diecut-shadow relative w-[440px] h-[480px] flex flex-col items-center">
                            
                            <!-- SVG Cloud Cutout Board (Yellow/Gold Theme) -->
                            <svg class="w-full h-[380px] drop-shadow-md z-10" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <!-- Outer White Border Die-cut line -->
                                <path d="M 80,200 C 40,160 40,100 90,70 C 130,20 220,10 270,50 C 310,10 400,20 440,70 C 490,110 480,180 450,220 C 490,270 450,340 390,340 C 330,360 270,350 220,360 C 160,370 90,340 60,290 C 20,240 40,220 80,200 Z" fill="#FFFFFF" stroke="#0B192C" stroke-width="12" stroke-linejoin="round"/>
                                
                                <!-- Inner Yellow Cloud Main Body -->
                                <path id="svgCloudBgFront" d="M 88,195 C 52,158 52,105 98,78 C 135,32 218,22 265,60 C 302,22 388,32 425,78 C 472,115 462,178 435,215 C 472,262 435,328 378,328 C 322,348 265,338 218,348 C 162,358 98,328 70,282 C 32,235 52,215 88,195 Z" fill="#FFDC26" stroke="#0B192C" stroke-width="8" stroke-linejoin="round"/>
                                
                                <!-- Decorative Stars & Rays -->
                                <polygon points="100,50 112,75 138,78 118,97 124,123 100,110 76,123 82,97 62,78 88,75" fill="#FF9F1C" stroke="#0B192C" stroke-width="5"/>
                                <polygon points="390,35 400,55 422,58 405,73 410,95 390,84 370,95 375,73 358,58 380,55" fill="#FF9F1C" stroke="#0B192C" stroke-width="5"/>
                                <polygon points="430,300 440,315 457,317 444,328 448,345 430,336 412,345 416,328 403,317 420,315" fill="#FF3366" stroke="#0B192C" stroke-width="4"/>
                                
                                <!-- Pop Action Lines Top Right -->
                                <path d="M 430,40 L 465,20 M 445,65 L 485,55 M 450,90 L 490,95" stroke="#0B192C" stroke-width="7" stroke-linecap="round"/>
                            </svg>

                            <!-- Center Text Overlay -->
                            <div class="absolute top-12 inset-x-0 h-[280px] z-20 flex flex-col items-center justify-center text-center px-8">
                                <div class="text-[10px] font-mono tracking-widest text-[#0b192c] bg-white/90 px-3 py-1 rounded-full border-2 border-[#0b192c] font-black uppercase mb-1 shadow-sm">
                                    真耶穌教會傳教百年西區音樂會
                                </div>

                                <!-- Dynamic Main Front Text -->
                                <div id="outFrontText" class="text-5xl md:text-6xl font-black font-sans text-white tracking-wider leading-snug text-stroke-pop my-auto">
                                    請跟我來
                                </div>

                                <div class="text-xs font-black text-[#0b192c] bg-amber-300 px-3 py-0.5 rounded-md border-2 border-[#0b192c] tracking-widest">
                                    大會工作人員引導
                                </div>
                            </div>

                            <!-- Plastic/Wood Handle Base Cutout -->
                            <div class="w-16 h-[110px] bg-white border-4 border-[#0b192c] rounded-b-2xl -mt-6 z-0 shadow-lg flex flex-col items-center justify-end pb-3">
                                <div class="w-8 h-2 bg-slate-300 rounded-full mb-1"></div>
                                <div class="w-8 h-2 bg-slate-300 rounded-full"></div>
                            </div>

                        </div>

                    </div>

                    <!-- BACK SIDE -->
                    <div id="signCardBack" class="back sign-card flex flex-col items-center justify-center p-2 select-none">
                        
                        <div class="sign-diecut-shadow relative w-[440px] h-[480px] flex flex-col items-center">
                            
                            <!-- SVG Cloud Cutout Board (Yellow/Gold Theme) - Mirrored for Backside Alignment -->
                            <svg class="w-full h-[380px] drop-shadow-md z-10" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform: scaleX(-1);">
                                <!-- Outer White Border Die-cut line -->
                                <path d="M 80,200 C 40,160 40,100 90,70 C 130,20 220,10 270,50 C 310,10 400,20 440,70 C 490,110 480,180 450,220 C 490,270 450,340 390,340 C 330,360 270,350 220,360 C 160,370 90,340 60,290 C 20,240 40,220 80,200 Z" fill="#FFFFFF" stroke="#0B192C" stroke-width="12" stroke-linejoin="round"/>
                                
                                <!-- Inner Yellow Cloud Main Body -->
                                <path id="svgCloudBgBack" d="M 88,195 C 52,158 52,105 98,78 C 135,32 218,22 265,60 C 302,22 388,32 425,78 C 472,115 462,178 435,215 C 472,262 435,328 378,328 C 322,348 265,338 218,348 C 162,358 98,328 70,282 C 32,235 52,215 88,195 Z" fill="#FFDC26" stroke="#0B192C" stroke-width="8" stroke-linejoin="round"/>
                                
                                <!-- Decorative Stars & Rays -->
                                <polygon points="100,50 112,75 138,78 118,97 124,123 100,110 76,123 82,97 62,78 88,75" fill="#FF9F1C" stroke="#0B192C" stroke-width="5"/>
                                <polygon points="390,35 400,55 422,58 405,73 410,95 390,84 370,95 375,73 358,58 380,55" fill="#FF9F1C" stroke="#0B192C" stroke-width="5"/>
                                <polygon points="430,300 440,315 457,317 444,328 448,345 430,336 412,345 416,328 403,317 420,315" fill="#FF3366" stroke="#0B192C" stroke-width="4"/>
                                
                                <!-- Pop Action Lines Top Right -->
                                <path d="M 430,40 L 465,20 M 445,65 L 485,55 M 450,90 L 490,95" stroke="#0B192C" stroke-width="7" stroke-linecap="round"/>
                            </svg>

                            <!-- Center Text Overlay -->
                            <div class="absolute top-12 inset-x-0 h-[280px] z-20 flex flex-col items-center justify-center text-center px-8">
                                <div class="text-[10px] font-mono tracking-widest text-[#0b192c] bg-white/90 px-3 py-1 rounded-full border-2 border-[#0b192c] font-black uppercase mb-1 shadow-sm">
                                    真耶穌教會傳教百年西區音樂會
                                </div>

                                <!-- Dynamic Main Back Text -->
                                <div id="outBackText" class="text-5xl md:text-6xl font-black font-sans text-white tracking-wider leading-snug text-stroke-pop my-auto">
                                    請跟我來
                                </div>

                                <div class="text-xs font-black text-[#0b192c] bg-amber-300 px-3 py-0.5 rounded-md border-2 border-[#0b192c] tracking-widest">
                                    大會工作人員引導
                                </div>
                            </div>

                            <!-- Plastic/Wood Handle Base Cutout -->
                            <div class="w-16 h-[110px] bg-white border-4 border-[#0b192c] rounded-b-2xl -mt-6 z-0 shadow-lg flex flex-col items-center justify-end pb-3">
                                <div class="w-8 h-2 bg-slate-300 rounded-full mb-1"></div>
                                <div class="w-8 h-2 bg-slate-300 rounded-full"></div>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 hidden bg-amber-500 text-slate-950 font-bold px-6 py-3 rounded-2xl shadow-2xl z-50 text-xs md:text-sm transition no-print">
        通知訊息
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-gray-500 border-t border-blue-900/40 pt-4 w-full max-w-7xl no-print">
        真耶穌教會傳教百年西區音樂會籌備小組 ‧ 現場接待與秩序維護組製作
    </footer>

    <script>
        const inFrontText = document.getElementById('inFrontText');
        const inBackText = document.getElementById('inBackText');
        const outFrontText = document.getElementById('outFrontText');
        const outBackText = document.getElementById('outBackText');

        const cardFlipper = document.getElementById('cardFlipper');
        const sideLabel = document.getElementById('sideLabel');
        const svgCloudBgFront = document.getElementById('svgCloudBgFront');
        const svgCloudBgBack = document.getElementById('svgCloudBgBack');
        const toast = document.getElementById('toast');

        let isFlipped = false;

        // Live Binding Input Text
        function bindText(inputEl, outputEl) {
            if (!inputEl || !outputEl) return;
            inputEl.addEventListener('input', (e) => {
                const val = e.target.value;
                outputEl.textContent = val;
                adjustFontSize(outputEl, val);
            });
        }

        bindText(inFrontText, outFrontText);
        bindText(inBackText, outBackText);

        // Adjust Font Size Automatically Based on Text Length
        function adjustFontSize(elem, text) {
            if (!elem) return;
            const len = text.length;
            if (len <= 4) {
                elem.className = "text-5xl md:text-6xl font-black font-sans text-white tracking-wider leading-snug text-stroke-pop my-auto";
            } else if (len <= 6) {
                elem.className = "text-4xl md:text-5xl font-black font-sans text-white tracking-wide leading-snug text-stroke-pop my-auto";
            } else {
                elem.className = "text-3xl md:text-4xl font-black font-sans text-white tracking-tight leading-snug text-stroke-pop my-auto";
            }
        }

        // Preset Selections
        function selectPreset(type) {
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.className = "preset-btn bg-[#081120] text-gray-300 hover:text-white font-bold p-3 rounded-xl transition border border-blue-900 flex items-center justify-between";
            });

            if (type === 'follow') {
                document.getElementById('btnPresetFollow').className = "preset-btn bg-amber-500 text-slate-950 font-black p-3 rounded-xl transition border border-amber-400 shadow flex items-center justify-between hover:brightness-110";
                inFrontText.value = "請跟我來";
                inBackText.value = "請跟我來";
            } else if (type === 'food') {
                document.getElementById('btnPresetFood').className = "preset-btn bg-amber-500 text-slate-950 font-black p-3 rounded-xl transition border border-amber-400 shadow flex items-center justify-between hover:brightness-110";
                inFrontText.value = "請勿飲食";
                inBackText.value = "請勿任意走動";
            } else if (type === 'quiet') {
                document.getElementById('btnPresetQuiet').className = "preset-btn bg-amber-500 text-slate-950 font-black p-3 rounded-xl transition border border-amber-400 shadow flex items-center justify-between hover:brightness-110";
                inFrontText.value = "請勿大聲喧嘩";
                inBackText.value = "請輕聲細語";
            }

            outFrontText.textContent = inFrontText.value;
            outBackText.textContent = inBackText.value;

            adjustFontSize(outFrontText, inFrontText.value);
            adjustFontSize(outBackText, inBackText.value);

            showToast('已套用舉手牌標語組合！');
        }

        // Toggle Flip Side
        function toggleFlipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardFlipper.classList.add('flipped');
                sideLabel.textContent = '目前顯示：反面';
            } else {
                cardFlipper.classList.remove('flipped');
                sideLabel.textContent = '目前顯示：正面';
            }
        }

        // Change Color Theme
        function changeColorTheme(theme) {
            if (theme === 'gold') {
                svgCloudBgFront.setAttribute('fill', '#FFDC26');
                svgCloudBgBack.setAttribute('fill', '#FFDC26');
            } else if (theme === 'amber') {
                svgCloudBgFront.setAttribute('fill', '#FF9F1C');
                svgCloudBgBack.setAttribute('fill', '#FF9F1C');
            } else if (theme === 'navy') {
                svgCloudBgFront.setAttribute('fill', '#112240');
                svgCloudBgBack.setAttribute('fill', '#112240');
            }
        }

        // Generate and Download Vector Die-cut Line (SVG)
        function downloadDiecutSVG() {
            showToast('⏳ 正在產生割型向量檔 (SVG)...');
            
            // Generate standard K-cut outline (100% Magenta stroke, no fill) combining cloud and handle
            const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="500" height="480">
                <g stroke="#FF00FF" stroke-width="2" fill="none">
                    <!-- Main Cloud Die-cut Line -->
                    <path d="M 80,200 C 40,160 40,100 90,70 C 130,20 220,10 270,50 C 310,10 400,20 440,70 C 490,110 480,180 450,220 C 490,270 450,340 390,340 C 330,360 270,350 220,360 C 160,370 90,340 60,290 C 20,240 40,220 80,200 Z" />
                    <!-- Handle Base Die-cut Line -->
                    <path d="M 218,340 L 218,460 C 218,470 226,475 236,475 L 264,475 C 274,475 282,470 282,460 L 282,340" />
                </g>
            </svg>`;
            
            const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '115音樂會_舉手牌刀模割型線_DieCut.svg';
            link.click();
            
            showToast('🎉 割型向量檔下載成功！請將此 SVG 提供給印刷廠對位割型。');
        }

        // Export High-Res Image (Front or Back)
        function downloadSignImage(side) {
            const sourceEl = side === 'front' ? document.getElementById('signCardFront') : document.getElementById('signCardBack');
            const textVal = side === 'front' ? inFrontText.value : inBackText.value;

            showToast(`⏳ 正在繪製 ${side === 'front' ? '正面' : '反面'} 高解析度舉手牌圖檔，請稍候...`);

            // 【終極修復】：建立一個乾淨的實體分身，徹底脫離 3D 動畫父層的干擾
            const clone = sourceEl.cloneNode(true);
            clone.classList.remove('back', 'front'); // 移除含有 3D 屬性的類別
            clone.style.transform = 'none'; // 強制清空所有變形
            
            // 將分身放入隱藏的獨立容器中，讓截圖引擎能單純讀取平面樣式
            const wrapper = document.createElement('div');
            wrapper.style.position = 'absolute';
            wrapper.style.top = '-9999px';
            wrapper.style.left = '-9999px';
            wrapper.appendChild(clone);
            document.body.appendChild(wrapper);

            html2canvas(clone, {
                scale: 3, // High Resolution Print Quality
                useCORS: true,
                allowTaint: true,
                backgroundColor: null,
            }).then(canvas => {
                // 截圖完成，銷毀分身
                document.body.removeChild(wrapper);

                const link = document.createElement('a');
                link.download = `音樂會舉手牌_${side === 'front' ? '正面' : '反面'}_${textVal}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();

                showToast('🎉 高解析度圖檔下載成功！(版面已自動對齊，可直接送廠)');
            }).catch(err => {
                console.error(err);
                if (document.body.contains(wrapper)) document.body.removeChild(wrapper);
                showToast('❌ 圖檔匯出失敗，請嘗試使用列印功能。');
            });
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3500);
        }
    </script>
</body>
</html>
