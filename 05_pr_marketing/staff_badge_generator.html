<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真耶穌教會臺灣傳教百週年115年西區音樂會 - 工作證識別證產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif, 'Inter', sans-serif;
            background-color: #050b14;
            color: #f8fafc;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #fff8cb 0%, #e5c158 40%, #c99a22 80%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glassmorphism panel for staff card */
        .badge-glass-panel {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        /* Badge Lanyard Slot Marker */
        .lanyard-hole {
            width: 32px;
            height: 8px;
            border-radius: 4px;
            background-color: #050b14;
            border: 1.5px solid rgba(212, 175, 55, 0.6);
            margin: 0 auto;
        }

        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
            }
            .no-print {
                display: none !important;
            }
            #badgeCanvas {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-5xl text-center mb-6 no-print">
        <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold mb-2">
            🪪 大會識別證 / 工作證印製樣板
        </div>
        <h1 class="text-2xl md:text-3xl font-black text-amber-300 tracking-wider">
            直式工作證與識別證產生器
        </h1>
        <p class="text-xs text-slate-400 mt-1">
            標準 54 × 86 mm 比例，套用 100 周年主視覺，可自由設定工作人員組別與發包列印
        </p>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- Left Controls (5 cols) -->
        <div class="lg:col-span-5 bg-slate-900 border border-amber-500/30 p-5 md:p-6 rounded-2xl shadow-xl space-y-4 no-print">
            <div class="border-b border-amber-500/30 pb-2">
                <h2 class="text-sm font-bold text-amber-300 flex items-center gap-2">
                    <span>⚙️</span> 工作證資料設定
                </h2>
            </div>

            <!-- Group Preset Quick Select -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">快速選擇工作組別：</label>
                <div class="flex flex-wrap gap-1.5">
                    <button onclick="setGroup('宣傳公關組')" class="bg-slate-800 hover:bg-amber-500/20 text-amber-200 border border-amber-500/30 px-2.5 py-1 rounded-lg text-xs transition">宣傳公關組</button>
                    <button onclick="setGroup('節目現場組')" class="bg-slate-800 hover:bg-amber-500/20 text-amber-200 border border-amber-500/30 px-2.5 py-1 rounded-lg text-xs transition">節目現場組</button>
                    <button onclick="setGroup('接待引導組')" class="bg-slate-800 hover:bg-amber-500/20 text-amber-200 border border-amber-500/30 px-2.5 py-1 rounded-lg text-xs transition">接待引導組</button>
                    <button onclick="setGroup('總務庶務組')" class="bg-slate-800 hover:bg-amber-500/20 text-amber-200 border border-amber-500/30 px-2.5 py-1 rounded-lg text-xs transition">總務庶務組</button>
                    <button onclick="setGroup('音響機動組')" class="bg-slate-800 hover:bg-amber-500/20 text-amber-200 border border-amber-500/30 px-2.5 py-1 rounded-lg text-xs transition">音響機動組</button>
                    <button onclick="setGroup('大會工作人員')" class="bg-slate-800 hover:bg-amber-500/20 text-amber-200 border border-amber-500/30 px-2.5 py-1 rounded-lg text-xs transition">大會工作人員</button>
                </div>
            </div>

            <div class="space-y-3 pt-2">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">盛會主題 (Top Title)</label>
                    <input type="text" id="inTheme" value="真耶穌教會臺灣傳教百週年115年西區音樂會" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">識別類別標題 (Center Big Banner)</label>
                    <input type="text" id="inBadgeType" value="工 作 證" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-amber-300 font-bold focus:outline-none focus:border-amber-400">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">服勤單位 / 組別名稱 (Department / Unit)</label>
                    <input type="text" id="inDepartment" value="宣傳公關組" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">底部備註標註 (Footer Note)</label>
                    <input type="text" id="inNote" value="請隨身佩戴 ‧ 憑證進出會場" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-amber-200 focus:outline-none focus:border-amber-400">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">主辦單位標記 (Organizer Name)</label>
                    <input type="text" id="inOrg" value="主辦單位：真耶穌教會臺灣總會西區辦事處" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-amber-400">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-3 space-y-2">
                <button onclick="downloadBadgeImage()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    下載工作證高解析圖檔 (PNG)
                </button>
                <button onclick="window.print()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold py-2.5 px-4 rounded-xl border border-amber-500/30 transition text-xs flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    列印 / 另存為 PDF 拼版
                </button>
            </div>
        </div>

        <!-- Right Badge Preview (7 cols) -->
        <div class="lg:col-span-7 flex flex-col items-center">
            <div class="text-xs uppercase tracking-widest text-amber-400/80 mb-3 font-mono no-print">
                🪪 胸前直式識別證實體預覽 (54 × 86 mm)
            </div>

            <!-- Standard Badge Card Canvas Container (Aspect Ratio 1:1.6) -->
            <div id="badgeCanvas" class="relative w-[340px] h-[544px] bg-cover bg-center border-2 border-amber-500/60 rounded-2xl shadow-2xl overflow-hidden p-5 flex flex-col justify-between text-center select-none" style="background-image: url('https://raw.githubusercontent.com/tjcdaxiinformation/tjc-centenary-concert/main/%E4%B8%BB%E8%A6%96%E8%A6%BA.png');">
                
                <!-- Semi-transparent overlay to keep text high-contrast -->
                <div class="absolute inset-0 bg-gradient-to-b from-slate-950/80 via-slate-950/40 to-slate-950/90 pointer-events-none"></div>

                <!-- Lanyard Hole Punch Visual Indicator -->
                <div class="relative z-10 pt-1">
                    <div class="lanyard-hole"></div>
                </div>

                <!-- Top Section: Event Theme Header -->
                <div class="relative z-10 space-y-1 mt-2">
                    <div class="inline-block px-2.5 py-0.5 rounded-full bg-amber-500/30 border border-amber-500/60 text-amber-200 text-[10px] tracking-[0.2em] font-bold uppercase">
                        1926-2026 臺灣傳教 100 周年
                    </div>
                    <h3 id="outTheme" class="text-xs font-bold text-slate-100 tracking-wider drop-shadow leading-snug px-2">
                        真耶穌教會臺灣傳教百週年115年西區音樂會
                    </h3>
                </div>

                <!-- Middle Section: Prominent "工作證" Banner & Unit Name -->
                <div class="relative z-10 my-auto py-4 px-3 badge-glass-panel rounded-2xl shadow-2xl space-y-3">
                    <div class="text-[10px] text-amber-400/80 tracking-widest uppercase font-semibold">
                        STAFF PASS
                    </div>

                    <!-- Big "工作證" Title -->
                    <h1 id="outBadgeType" class="text-3xl font-black gold-gradient-text tracking-[0.25em] drop-shadow-lg">
                        工 作 證
                    </h1>

                    <div class="w-16 h-0.5 bg-gradient-to-r from-transparent via-amber-400 to-transparent mx-auto opacity-80 my-1"></div>

                    <!-- Department Unit Name -->
                    <div id="outDepartment" class="text-base font-bold text-slate-100 tracking-wider">
                        宣傳公關組
                    </div>
                </div>

                <!-- Bottom Section: Footer Note & Organizer Info -->
                <div class="relative z-10 space-y-2 pt-2 border-t border-amber-500/30">
                    <div id="outNote" class="text-xs font-bold text-amber-200 tracking-widest bg-amber-500/20 py-1 px-3 rounded-lg border border-amber-500/30 inline-block">
                        請隨身佩戴 ‧ 憑證進出會場
                    </div>

                    <div id="outOrg" class="text-[9px] text-slate-300 font-semibold tracking-wider">
                        主辦單位：真耶穌教會臺灣總會西區辦事處
                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden bg-amber-500 text-slate-950 font-bold px-5 py-2.5 rounded-xl shadow-2xl text-xs z-50">
        通知訊息
    </div>

    <footer class="mt-8 text-center text-xs text-slate-500 no-print">
        真耶穌教會傳教百年西區音樂會籌備小組 ‧ 宣傳與公關組製作
    </footer>

    <script>
        const inTheme = document.getElementById('inTheme');
        const inBadgeType = document.getElementById('inBadgeType');
        const inDepartment = document.getElementById('inDepartment');
        const inNote = document.getElementById('inNote');
        const inOrg = document.getElementById('inOrg');

        const outTheme = document.getElementById('outTheme');
        const outBadgeType = document.getElementById('outBadgeType');
        const outDepartment = document.getElementById('outDepartment');
        const outNote = document.getElementById('outNote');
        const outOrg = document.getElementById('outOrg');

        function bindText(inputEl, outputEl) {
            if (!inputEl || !outputEl) return;
            inputEl.addEventListener('input', (e) => {
                outputEl.textContent = e.target.value;
            });
        }

        bindText(inTheme, outTheme);
        bindText(inBadgeType, outBadgeType);
        bindText(inDepartment, outDepartment);
        bindText(inNote, outNote);
        bindText(inOrg, outOrg);

        function setGroup(name) {
            if (inDepartment) {
                inDepartment.value = name;
                if (outDepartment) outDepartment.textContent = name;
            }
        }

        function downloadBadgeImage() {
            const canvas = document.getElementById('badgeCanvas');
            showToast('⏳ 正在為您繪製高解析度工作證圖檔...');

            html2canvas(canvas, {
                scale: 4, // High resolution for badge printing
                useCORS: true,
                allowTaint: true,
                backgroundColor: null
            }).then(c => {
                const link = document.createElement('a');
                const dept = inDepartment.value || '工作證';
                link.download = `傳教百年音樂會_工作證_${dept}.png`;
                link.href = c.toDataURL('image/png', 1.0);
                link.click();
                showToast('🎉 工作證高解析圖檔已成功下載！');
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
