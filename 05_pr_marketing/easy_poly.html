<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>各小區音樂會海報預覽</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #0f172a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 易拉寶大海報比例設定 (約 1:2) */
        .poster-container {
            width: 100%;
            max-width: 720px; /* 控制海報最大寬度 */
            aspect-ratio: 1 / 2;
            position: relative;
            background-image: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1507838153414-b4b713384a76?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 4px solid #334155;
        }

        /* 直書文字 */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.5em;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 158, 11, 0.6);
        }

        /* 不規則圖片裁切 (Blob) 與交疊效果 */
        .blob-photo {
            position: absolute;
            object-fit: cover;
            border: 3px solid #fcd34d;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            z-index: 10;
            background-color: #1e293b;
        }
        
        .blob-photo:hover {
            transform: scale(1.1) rotate(0deg) !important;
            z-index: 20;
        }

        /* 地圖區域特效 */
        #map {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            mask-image: linear-gradient(to right, transparent, black 15%);
            -webkit-mask-image: linear-gradient(to right, transparent, black 15%);
            z-index: 5;
        }

        /* SVG 虛線與箭頭覆蓋層 */
        #svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        /* 自訂地圖圖標 */
        .custom-map-pin {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .pin-icon {
            background-color: #d97706;
            border: 2px solid white;
            border-radius: 50%;
            padding: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pin-label {
            margin-top: 4px;
            background: rgba(0,0,0,0.7);
            color: #fcd34d;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <div class="mb-6 flex flex-wrap items-center gap-4 bg-slate-800/80 p-4 rounded-xl shadow-lg border border-slate-700 w-full max-w-4xl justify-center z-50">
        <h1 class="text-xl font-bold text-amber-400">音樂會海報產生器</h1>
        <div class="flex items-center gap-2">
            <label for="district-select" class="text-sm text-slate-300">選擇小區：</label>
            <select id="district-select" onchange="switchDistrict(this.value)" class="bg-slate-900 text-amber-400 border border-amber-500/50 rounded-lg px-4 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-amber-500/50 cursor-pointer">
                <option value="fuxing">復興小區</option>
                <option value="zhumiao">竹苗小區</option>
                <option value="zhongmiao">中苗小區</option>
                <option value="nantou">南投小區</option>
            </select>
        </div>
        <button onclick="fitMapBounds()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg text-sm transition-colors">
            置中地圖
        </button>
    </div>

    <div id="poster" class="poster-container">
        
        <!-- 地圖區域 (右半部) -->
        <div id="map"></div>

        <!-- 照片區域 (左半部) -->
        <div id="photo-container" class="absolute top-0 left-0 w-1/2 h-full z-10 p-4 relative">
            <!-- 動態插入照片 -->
        </div>

        <!-- 中央大字直書標題 -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
            <div class="flex gap-4 items-center">
                <h2 id="poster-title-district" class="vertical-text text-5xl font-black text-white drop-shadow-[0_0_10px_rgba(0,0,0,1)]">復興小區</h2>
                <h1 id="poster-title-main" class="vertical-text text-6xl font-black text-amber-400 drop-shadow-[0_0_15px_rgba(0,0,0,1)]">音樂會</h1>
            </div>
        </div>

        <!-- SVG 覆蓋層 (用於繪製虛線箭頭) -->
        <svg id="svg-overlay">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#fcd34d" />
                </marker>
            </defs>
            <!-- 動態插入 path -->
        </svg>

    </div>

    <script>
        const terrainTileLayers = [
            {
                url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
                attribution: '&copy; OpenTopoMap'
            }
        ];

        const districtData = {
            fuxing: {
                title: "復興小區",
                churches: [
                    { name: "八德", lat: 24.934632, lng: 121.299978, image: "八德教會.jpg", showPhoto: true },
                    { name: "崎頂", lat: 24.900432, lng: 121.282682, image: "崎頂教會.jpg", showPhoto: true },
                    { name: "大溪", lat: 24.881231, lng: 121.294548, image: "大溪教會.jpg", showPhoto: true },
                    { name: "復興", lat: 24.826416, lng: 121.356914, image: "復興教會.jpg", showPhoto: true },
                    { name: "義盛", lat: 24.779475, lng: 121.365940, image: "義盛教會.jpg", showPhoto: true },
                    { name: "大灣", lat: 24.760693, lng: 121.344903, image: "大灣教會.jpg", showPhoto: true },
                    { name: "雪霧鬧", lat: 24.741287, lng: 121.365961, image: "雪霧鬧教會.jpg", showPhoto: true }
                ]
            },
            zhumiao: {
                title: "竹苗小區",
                churches: [
                    { name: "花園", lat: 24.645038, lng: 121.151893, image: "花園教會.jpg", showPhoto: true },
                    { name: "五峰", lat: 24.629047, lng: 121.119750, image: "五峰教會.jpg", showPhoto: true },
                    { name: "桃山", lat: 24.599219, lng: 121.109834, image: "桃山教會.jpg", showPhoto: true },
                    { name: "清泉", lat: 24.578934, lng: 121.106060, image: "清泉教會.jpg", showPhoto: true },
                    { name: "義興", lat: 24.683555, lng: 121.185258, image: "義興教會.jpg", showPhoto: true },
                    { name: "錦屏", lat: 24.695765, lng: 121.227790, image: "錦屏教會.jpg", showPhoto: true },
                    { name: "尖石", lat: 24.720930, lng: 121.214883, image: "尖石教會.jpg", showPhoto: true }
                ]
            },
            zhongmiao: {
                title: "中苗小區",
                churches: [
                    { name: "東勢", lat: 24.249405, lng: 120.832019, image: "東勢教會.jpg", showPhoto: true },
                    { name: "自由", lat: 24.270630, lng: 120.890200, image: "自由教會.jpg", showPhoto: true },
                    { name: "雙崎", lat: 24.290980, lng: 120.908350, image: "雙崎教會.jpg", showPhoto: true },
                    { name: "達觀", lat: 24.321900, lng: 120.921956, image: "達觀教會.jpg", showPhoto: true },
                    { name: "南勢", lat: 24.170876, lng: 120.896805, image: "南勢教會.jpg", showPhoto: true },
                    { name: "裡冷", lat: 24.164515, lng: 120.952551, image: "裡冷教會.jpg", showPhoto: true },
                    { name: "博愛", lat: 24.174447, lng: 120.978225, image: "博愛教會.jpg", showPhoto: true }
                ]
            },
            nantou: {
                title: "南投小區",
                churches: [
                    { name: "翠巒", lat: 24.182960, lng: 121.204100, image: "翠巒教會.jpg", showPhoto: true },
                    { name: "力行", lat: 24.148459, lng: 121.190195, image: "力行教會.jpg", showPhoto: true },
                    { name: "紅香", lat: 24.159071, lng: 121.176026, image: "紅香教會.jpg", showPhoto: true },
                    { name: "慈峰", lat: 24.131208, lng: 121.184243, image: "慈峰教會.jpg", showPhoto: true },
                    { name: "精英", lat: 24.061304, lng: 121.194630, image: "精英教會.jpg", showPhoto: true },
                    { name: "廬山", lat: 24.033899, lng: 121.185267, image: "廬山教會.jpg", showPhoto: true },
                    { name: "春陽", lat: 24.027045, lng: 121.149445, image: "春陽教會.jpg", showPhoto: true }
                ]
            }
        };

        let map;
        let markers = [];
        let photoElements = [];

        // 產生多樣化的不規則形狀(Blob)
        const blobShapes = [
            "60% 40% 30% 70% / 60% 30% 70% 40%",
            "40% 60% 70% 30% / 40% 50% 60% 50%",
            "50% 50% 20% 80% / 25% 80% 20% 75%",
            "30% 70% 70% 30% / 30% 30% 70% 70%",
            "70% 30% 50% 50% / 50% 70% 30% 50%"
        ];

        function initMap() {
            // 初始化地圖，隱藏預設縮放按鈕以保持海報美觀
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([24.8, 121.3], 10);
            L.tileLayer(terrainTileLayers[0].url, { maxZoom: 14 }).addTo(map);

            // 當地圖移動或縮放時，重新繪製連接線
            map.on('move', drawConnections);
            map.on('zoom', drawConnections);
            map.on('resize', drawConnections);

            // 預設載入第一個小區
            switchDistrict('fuxing');
        }

        // 創建自訂標記圖標
        function createPinIcon(name) {
            return L.divIcon({
                className: 'custom-map-pin',
                html: `
                    <div class="pin-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8c0 3.6-6 12-6 12s-6-8.4-6-12a6 6 0 0 1 12 0Z"/><circle cx="12" cy="8" r="3"/></svg>
                    </div>
                    <div class="pin-label">${name}</div>
                `,
                iconSize: [40, 50],
                iconAnchor: [20, 50]
            });
        }

        function switchDistrict(districtKey) {
            const data = districtData[districtKey];
            if (!data) return;

            // 更新海報標題
            document.getElementById('poster-title-district').innerText = data.title;

            // 清除現有資料
            markers.forEach(m => map.removeLayer(m.marker));
            markers = [];
            const photoContainer = document.getElementById('photo-container');
            photoContainer.innerHTML = '';
            photoElements = [];

            // 篩選有照片的教會
            const targetChurches = data.churches.filter(c => c.showPhoto);
            
            // 計算照片容器的高寬以便散佈
            const posterH = document.getElementById('poster').clientHeight;
            const itemHeight = 100 / targetChurches.length;

            targetChurches.forEach((church, index) => {
                // 1. 添加地圖標記
                const marker = L.marker([church.lat, church.lng], { 
                    icon: createPinIcon(church.name) 
                }).addTo(map);
                
                // 2. 添加左側照片
                const img = document.createElement('img');
                // 若找不到真實檔案，使用 placehold.co 產生佔位圖避免破圖
                img.src = `${church.image}`;
                img.onerror = () => {
                    img.src = `https://placehold.co/400x400/1e293b/fcd34d?text=${church.name}`;
                };
                img.className = 'blob-photo';
                
                // 隨機不規則形狀與微旋轉
                const blobShape = blobShapes[index % blobShapes.length];
                const rotation = (Math.random() * 20) - 10; // -10 to +10 degrees
                
                // 計算左側交疊的垂直分佈
                const topPos = index * itemHeight + (Math.random() * 5); // %
                const leftPos = (Math.random() * 30) + 10; // 10% to 40% of the left container (which is 50% of poster)
                const widthSize = (Math.random() * 20) + 110; // 110px to 130px

                img.style.width = `${widthSize}px`;
                img.style.height = `${widthSize}px`;
                img.style.top = `calc(${topPos}% - ${widthSize/2}px)`;
                img.style.left = `${leftPos}%`;
                img.style.borderRadius = blobShape;
                img.style.transform = `rotate(${rotation}deg)`;
                img.id = `photo-${index}`;

                photoContainer.appendChild(img);

                // 紀錄以便畫線
                markers.push({
                    church: church,
                    marker: marker,
                    imgElement: img
                });
            });

            // 調整地圖視野至所有標記
            fitMapBounds();
        }

        function fitMapBounds() {
            if (markers.length > 0) {
                const group = new L.featureGroup(markers.map(m => m.marker));
                // 給地圖右半邊留一點 padding
                map.fitBounds(group.getBounds(), { padding: [30, 30] });
                // 延遲一點等動畫結束後畫線
                setTimeout(drawConnections, 300);
            }
        }

        function drawConnections() {
            const svgOverlay = document.getElementById('svg-overlay');
            const poster = document.getElementById('poster');
            
            // 清空舊的線條
            svgOverlay.innerHTML = `
                <defs>
                    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                        <polygon points="0 0, 8 3, 0 6" fill="#fcd34d" opacity="0.8" />
                    </marker>
                </defs>
            `;

            const posterRect = poster.getBoundingClientRect();
            const mapContainer = document.getElementById('map');
            const mapRect = mapContainer.getBoundingClientRect();

            markers.forEach((m) => {
                // 取得地圖上標記的位置 (相對於 map container)
                const mapPoint = map.latLngToContainerPoint(m.marker.getLatLng());
                
                // 轉換為相對於 poster container 的座標
                // map container 在右邊 (left: 50%)
                const targetX = mapPoint.x + (mapContainer.offsetLeft);
                const targetY = mapPoint.y + (mapContainer.offsetTop);

                // 取得圖片中心點位置 (相對於 poster container)
                const imgRect = m.imgElement.getBoundingClientRect();
                const startX = (imgRect.left - posterRect.left) + (imgRect.width / 2);
                const startY = (imgRect.top - posterRect.top) + (imgRect.height / 2);

                // 計算貝茲曲線 (Bezier Curve) 讓線條有柔和的彎曲感
                const controlX1 = startX + (targetX - startX) * 0.3;
                const controlY1 = startY;
                const controlX2 = startX + (targetX - startX) * 0.7;
                const controlY2 = targetY;

                // 繪製 SVG Path
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${startX},${startY} C ${controlX1},${controlY1} ${controlX2},${controlY2} ${targetX},${targetY}`);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', '#fcd34d');
                path.setAttribute('stroke-width', '2');
                path.setAttribute('stroke-dasharray', '6,6');
                path.setAttribute('opacity', '0.7');
                path.setAttribute('marker-end', 'url(#arrowhead)');
                
                svgOverlay.appendChild(path);
            });
        }

        window.onload = function() {
            initMap();
            // 監聽視窗大小改變，確保響應式下的座標線條正確
            window.addEventListener('resize', () => {
                setTimeout(drawConnections, 100);
            });
        };
    </script>
</body>
</html>
