        // 4. 海報風格主題切換 (深藍典雅 / 米白雅致)
        function changeTheme(theme) {
            const frame = document.getElementById('poster-frame');
            const navyBtn = document.getElementById('theme-btn-navy');
            const creamBtn = document.getElementById('theme-btn-cream');

            if (theme === 'cream') {
                frame.className = "poster-container poster-card w-full max-w-[840px] bg-church-cream text-slate-900 rounded-3xl overflow-hidden border border-amber-600/30 relative flex flex-col";
                frame.style.backgroundImage = "linear-gradient(to bottom, rgba(252, 251, 247, 0.90), rgba(248, 246, 238, 0.95)), url('主視覺.png'), url('https://raw.githubusercontent.com/tjcdaxiinformation/tjc-centenary-concert/main/%E4%B8%BB%E8%A6%96%E8%A6%9A.png')";
                frame.style.backgroundSize = "cover";
                frame.style.backgroundPosition = "center";
                
                navyBtn.className = "px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition";
                creamBtn.className = "px-2.5 py-1 rounded-md bg-amber-500 text-slate-950 font-bold transition";
            } else {
                frame.className = "poster-container poster-card poster-bg-visual w-full max-w-[840px] text-white rounded-3xl overflow-hidden border border-amber-500/30 relative flex flex-col";
                frame.style.backgroundImage = "";
                
                navyBtn.className = "px-2.5 py-1 rounded-md bg-amber-500 text-slate-950 font-bold transition";
                creamBtn.className = "px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition";
            }
        }
    </script>
