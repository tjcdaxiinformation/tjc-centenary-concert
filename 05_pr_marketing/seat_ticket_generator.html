    <!-- 邏輯腳本 -->
    <script>
        // 全域座位數據儲存結構
        let seatData = [];
        let currentFilter = 'all';
        let previewIndex = 0;

        // 提示訊息彈窗
        function showNotification(msg) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // 0. 全角字元轉半角字元處理
        function normalizeText(str) {
            if (!str) return '';
            return str.replace(/[\uFF01-\uFF5E]/g, function(ch) {
                return String.fromCharCode(ch.charCodeAt(0) - 0xfee0);
            }).replace(/\u3000/g, ' ');
        }

        // 層別名稱標準化：統一為「下層(1樓入口)」與「上層(2樓入口)」
        function normalizeFloorName(fl) {
            if (!fl) return '下層(1樓入口)';
            if (fl.includes('上層') || fl.includes('2樓') || fl.includes('2F')) {
                return '上層(2樓入口)';
            }
            return '下層(1樓入口)';
        }

        // 1. 核心座位展開器：將「排別: A, 列數/總數: 27」自動展開為 01~27 號門票
        function generateRowSeats(floor, zone, rowStr, totalSeats) {
            const seats = [];
            const padElem = document.getElementById('pad-zero-checkbox');
            const usePad = padElem ? padElem.checked : true;
            const normalizedFloor = normalizeFloorName(floor);

            for (let s = 1; s <= totalSeats; s++) {
                const seatNo = usePad ? String(s).padStart(2, '0') : String(s);
                seats.push({
                    floor: normalizedFloor,
                    zone: zone || '',
                    row: rowStr.toUpperCase(),
                    seat: seatNo,
                    raw: `${normalizedFloor} ${zone ? zone + ' ' : ''}${rowStr}排 ${seatNo}號`
                });
            }
            return seats;
        }

        // 2. 解析純文字輸入框
        function parseRawText() {
            const rawText = document.getElementById('paste-input').value;
            const lines = rawText.split('\n');
            seatData = [];

            let currentFloor = '下層(1樓入口)';
            let currentZone = '';

            lines.forEach(line => {
                let str = normalizeText(line.trim());
                if (!str) return;

                // 檢查層別區塊標題
                if (str.includes('上層') || str.includes('2樓') || str.includes('2F')) {
                    currentFloor = '上層(2樓入口)';
                } else if (str.includes('下層') || str.includes('1樓') || str.includes('1F')) {
                    currentFloor = '下層(1樓入口)';
                }

                // 檢查區域標題 (例如：A區, B區)
                const zoneMatch = str.match(/([A-Za-z]|左|中|右|黃|藍|紅)區/);
                if (zoneMatch) {
                    currentZone = zoneMatch[0];
                }

                // 清理標點，將頓號/逗號/冒號換成空格
                let cleanStr = str.replace(/[、、,;\/:：]/g, ' ');

                // 模式 1: 帶有「列數」、「座位數」、「共X張」語法
                const countMatch = cleanStr.match(/([A-Za-z]{1,2}|\d+)\s*排?\s*(?:列數|座位數|張數|容量|共)?\s*(\d+)\s*(?:個位子|個座位|個|位|號|張)?/i);
                
                // 模式 2: 範圍語法 "A排 1~27號"
                const rangeMatch = cleanStr.match(/([A-Za-z]{1,2}|\d+)\s*排?\s*(\d+)\s*[-~到]\s*(\d+)\s*號?/i);

                if (rangeMatch) {
                    const rowStr = rangeMatch[1].toUpperCase();
                    const startSeat = parseInt(rangeMatch[2], 10);
                    const endSeat = parseInt(rangeMatch[3], 10);
                    if (!isNaN(startSeat) && !isNaN(endSeat) && endSeat >= startSeat && endSeat <= 300) {
                        for (let s = startSeat; s <= endSeat; s++) {
                            const padElem = document.getElementById('pad-zero-checkbox');
                            const usePad = padElem ? padElem.checked : true;
                            const seatNo = usePad ? String(s).padStart(2, '0') : String(s);
                            seatData.push({
                                floor: currentFloor,
                                zone: currentZone,
                                row: rowStr,
                                seat: seatNo,
                                raw: `${currentFloor} ${currentZone ? currentZone + ' ' : ''}${rowStr}排 ${seatNo}號`
                            });
                        }
                        return;
                    }
                }

                // 匹配「排別」+「列數(總個數)」
                if (countMatch && !cleanStr.includes('1號') && !cleanStr.includes('01號')) {
                    const rowStr = countMatch[1].toUpperCase();
                    const totalSeats = parseInt(countMatch[2], 10);

                    if (!isNaN(totalSeats) && totalSeats > 0 && totalSeats <= 300) {
                        const generated = generateRowSeats(currentFloor, currentZone, rowStr, totalSeats);
                        seatData = seatData.concat(generated);
                        return;
                    }
                }

                // 單筆座位解析 (如: 下層 A排 1號)
                const singleSeatMatch = cleanStr.match(/([A-Za-z]{1,2}|\d+)\s*排\s*(\d+)\s*號/);
                if (singleSeatMatch) {
                    const rowStr = singleSeatMatch[1].toUpperCase();
                    const padElem = document.getElementById('pad-zero-checkbox');
                    const usePad = padElem ? padElem.checked : true;
                    const sNo = usePad ? String(singleSeatMatch[2]).padStart(2, '0') : singleSeatMatch[2];
                    seatData.push({
                        floor: currentFloor,
                        zone: currentZone,
                        row: rowStr,
                        seat: sNo,
                        raw: `${currentFloor} ${currentZone ? currentZone + ' ' : ''}${rowStr}排 ${sNo}號`
                    });
                }
            });

            updateAllViews();
        }

        // 3. 處理 Excel 檔案匯入
        function processExcelFile(file) {
            document.getElementById('file-name-display').innerText = `已載入檔案：${file.name}`;
            document.getElementById('file-name-display').classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (!jsonRows || jsonRows.length === 0) {
                        alert("Excel 檔案內容為空！");
                        return;
                    }

                    seatData = [];
                    let headerRowIndex = -1;
                    let colMap = { floor: -1, zone: -1, row: -1, count: -1, seat: -1, full: -1 };

                    for (let i = 0; i < Math.min(jsonRows.length, 10); i++) {
                        const row = jsonRows[i].map(c => normalizeText(String(c || '').trim()));
                        row.forEach((cell, colIdx) => {
                            if (/層別|樓層|層/.test(cell)) colMap.floor = colIdx;
                            if (/區域|區別|區/.test(cell)) colMap.zone = colIdx;
                            if (/^排號$|^排別$\vert{}^排$/i.test(cell) || (cell.includes('排') && !cell.includes('編號'))) colMap.row = colIdx;
                            if (/列數|座位數|張數|總數|數量|個數|容量|個位子/i.test(cell)) colMap.count = colIdx;
                            if (/^座號$|^號$\vert{}^座位號$/i.test(cell)) colMap.seat = colIdx;
                            if (/座椅編號|座位編號|門票編號|套印|編號/.test(cell)) colMap.full = colIdx;
                        });

                        if (colMap.row !== -1 || colMap.count !== -1 || colMap.full !== -1) {
                            headerRowIndex = i;
                            break;
                        }
                    }

                    let currentFloor = '下層(1樓入口)';
                    let currentZone = '';

                    const startIdx = headerRowIndex >= 0 ? headerRowIndex + 1 : 0;
                    for (let i = startIdx; i < jsonRows.length; i++) {
                        const row = jsonRows[i];
                        if (!row || row.length === 0) continue;

                        let fl = colMap.floor !== -1 ? normalizeText(String(row[colMap.floor] || '')) : '';
                        let zn = colMap.zone !== -1 ? normalizeText(String(row[colMap.zone] || '')) : '';
                        let rw = colMap.row !== -1 ? normalizeText(String(row[colMap.row] || '')).replace(/排/g, '') : '';
                        let cntStr = colMap.count !== -1 ? normalizeText(String(row[colMap.count] || '')) : '';
                        let stStr = colMap.seat !== -1 ? normalizeText(String(row[colMap.seat] || '')).replace(/號/g, '') : '';

                        currentFloor = normalizeFloorName(fl || currentFloor);
                        fl = currentFloor;

                        if (zn) currentZone = zn;
                        else zn = currentZone;

                        let totalCount = parseInt(cntStr.replace(/\D/g, ''), 10);
                        if (rw && !isNaN(totalCount) && totalCount > 0) {
                            const generated = generateRowSeats(fl, zn, rw, totalCount);
                            seatData = seatData.concat(generated);
                            continue;
                        }

                        if (!rw || !stStr) {
                            row.forEach(cell => {
                                const cStr = normalizeText(String(cell || '').trim());
                                const rM = cStr.match(/^([A-Za-z]{1,2})$/i) \vert{}\vert{} cStr.match(/^([A-Za-z]{1,2})\s*排$/i);
                                if (rM && !rw) rw = rM[1];

                                const cM = cStr.match(/^(\d+)$/);
                                if (cM && isNaN(totalCount)) {
                                    const val = parseInt(cM[1], 10);
                                    if (val > 0 && val <= 300) totalCount = val;
                                }
                            });

                            if (rw && !isNaN(totalCount) && totalCount > 1) {
                                const generated = generateRowSeats(fl, zn, rw, totalCount);
                                seatData = seatData.concat(generated);
                                continue;
                            }
                        }

                        if (rw && stStr) {
                            const padElem = document.getElementById('pad-zero-checkbox');
                            const usePad = padElem ? padElem.checked : true;
                            const seatNo = usePad ? stStr.padStart(2, '0') : stStr;
                            seatData.push({
                                floor: fl,
                                zone: zn,
                                row: rw.toUpperCase(),
                                seat: seatNo,
                                raw: `${fl} ${zn} ${rw}排 ${seatNo}號`
                            });
                        }
                    }

                    updateAllViews();
                    showNotification(`成功解析！已根據列數自動展開生成 ${seatData.length} 張門票！`);
                } catch (err) {
                    console.error(err);
                    alert("讀取 Excel 檔案失敗，請確定檔案是否為有效的 .xlsx / .csv。");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 5. 更新所有統計與檢視 UI
        function updateAllViews() {
            const total = seatData.length;
            const lowerCount = seatData.filter(s => s.floor.includes('下層')).length;
            const upperCount = seatData.filter(s => s.floor.includes('上層')).length;
            
            const rowsSet = new Set(seatData.map(s => `${s.floor}-${s.zone}-${s.row}`));

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-lower').innerText = lowerCount;
            document.getElementById('stat-upper').innerText = upperCount;
            document.getElementById('stat-rows').innerText = rowsSet.size;

            document.getElementById('count-filter-all').innerText = total;
            document.getElementById('count-filter-lower').innerText = lowerCount;
            document.getElementById('count-filter-upper').innerText = upperCount;

            renderRowBreakdown();
            previewIndex = 0;
            renderTable();
            updateTicketPreview();

        // 6. 格式化輸出字樣
        function getFormattedSeatText(item) {
            const template = document.getElementById('template-select').value;
            const zoneText = item.zone ? item.zone + ' ' : '';
            const padElem = document.getElementById('pad-zero-checkbox');
            const usePad = padElem ? padElem.checked : true;
            const seatNo = usePad ? String(item.seat).padStart(2, '0') : String(item.seat);

            if (template === 'punctuated') {
                return `${item.floor}、${item.row}排、${seatNo}號`;
            } else if (template === 'compact') {
                return `${item.floor}-${zoneText}${item.row}排-${seatNo}號`;
            } else if (template === 'vendor') {
                return `${item.floor} / ${zoneText}${item.row}排${seatNo}號`;
            }
            return `${item.floor} ${zoneText}${item.row}排 ${seatNo}號`;
        }

        // 7. 渲染列表表格
        function renderTable() {
            const tbody = document.getElementById('seats-table-body');
            const searchKeyword = document.getElementById('search-input').value.trim();

            let filtered = seatData;

            if (currentFilter === 'lower') {
                filtered = filtered.filter(s => s.floor.includes('下層'));
            } else if (currentFilter === 'upper') {
                filtered = filtered.filter(s => s.floor.includes('上層'));
            }

            if (searchKeyword) {
                filtered = filtered.filter(s => 
                    s.row.includes(searchKeyword) || 
                    s.seat.includes(searchKeyword) || 
                    s.zone.includes(searchKeyword) ||
                    s.floor.includes(searchKeyword)
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 italic">無符合條件的座位資料</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((item, idx) => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-2.5 px-3 font-mono text-[11px] text-slate-400">${(idx + 1).toString().padStart(4, '0')}</td>
                    <td class="py-2.5 px-3 font-bold ${item.floor.includes('上層') ? 'text-purple-700' : 'text-blue-700'}">
                        <span class="px-2 py-0.5 rounded-full text-[10px] ${item.floor.includes('上層') ? 'bg-purple-50' : 'bg-blue-50'}">${item.floor}</span>
                    </td>
                    <td class="py-2.5 px-3 text-slate-600">${item.zone || '-'}</td>
                    <td class="py-2.5 px-3 font-semibold text-slate-800">${item.row} 排</td>
                    <td class="py-2.5 px-3 font-semibold text-slate-800">${item.seat} 號</td>
                    <td class="py-2.5 px-3 font-mono font-bold text-church-navy">${getFormattedSeatText(item)}</td>
                </tr>
            `).join('');
        }
