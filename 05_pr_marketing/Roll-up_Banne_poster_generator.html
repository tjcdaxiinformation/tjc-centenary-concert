<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海報產生器 (預覽)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
    <!-- Font Awesome for map marker icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#141824', // 外圍背景色
                            posterBg: '#131e33', // 海報深藍色
                            gold: '#dfb754',
                            text: '#f3f4f6'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #141824;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Noto Serif TC', serif;
            margin: 0;
            min-height: 100vh;
        }

        /* 頂部工具列 */
        .toolbar {
            width: 100%;
            background-color: #1a2235;
            border-bottom: 1px solid #334155;
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* 鎖定海報比例 (直式 9:16 或類似尺寸) */
        .poster-wrapper {
            margin-top: 2rem;
            margin-bottom: 4rem;
            transform-origin: top center;
            transition: transform 0.2s ease-out;
        }

        #poster {
            width: 800px;
            height: 1422px; /* 16:9 ratio */
            position: relative;
            background: linear-gradient(180deg, #0d1527 0%, #152039 100%);
            color: white;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 背景網點裝飾 */
        .bg-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        /* 背景垂直大字 */
        .bg-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.05);
            writing-mode: vertical-rl;
            text-orientation: upright;
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: -2rem;
        }

        /* 不規則泡泡樣式 */
        .blob {
            position: absolute;
            border: 2px solid #dfb754;
            background: rgba(30, 41, 59, 0.7);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #dfb754;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 0.2rem;
            z-index: 20;
            transition: all 0.3s ease;
        }

        /* 產生不規則形狀 */
        .blob-1 { border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%; width: 220px; height: 130px; }
        .blob-2 { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; width: 200px; height: 140px; }
        .blob-3 { border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%; width: 210px; height: 130px; }
        .blob-4 { border-radius: 40% 60% 50% 50% / 50% 50% 60% 40%; width: 230px; height: 140px; }

        /* 地標與名稱標籤 */
        .pin-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            transform: translate(-50%, -100%); /* 將定位點設在圖標底部中心 */
        }
        
        .pin-icon {
            color: #dfb754;
            font-size: 1.8rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            margin-bottom: 4px;
        }

        .pin-label {
            background-color: #1a2235;
            border: 1px solid #dfb754;
            color: #f3f4f6;
            padding: 2px 8px;
            font-size: 0.85rem;
            border-radius: 4px;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* SVG 連線層 */
        #connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .connection-line {
            fill: none;
            stroke: #dfb754;
            stroke-width: 3;
            stroke-dasharray: 6 6;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <h1 class="text-brand-gold text-2xl font-bold tracking-wider mr-4">海報產生器 (預覽)</h1>
        
        <!-- 區域選擇下拉選單 -->
        <div class="relative">
            <select id="zone-select" onchange="renderPoster()" class="appearance-none bg-[#1e293b] border border-brand-gold text-brand-gold py-2 pl-4 pr-10 rounded text-lg font-bold focus:outline-none cursor-pointer">
                <option value="zhongmiao">中苗小區</option>
                <option value="other">其他小區 (測試)</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-brand-gold">
                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
            </div>
        </div>

        <!-- 縮放控制 -->
        <button onclick="zoomPoster(-0.1)" class="bg-[#334155] hover:bg-[#475569] text-white px-4 py-2 rounded transition-colors text-lg">
            - 縮小
        </button>
        <button onclick="zoomPoster(0.1)" class="bg-[#334155] hover:bg-[#475569] text-white px-4 py-2 rounded transition-colors text-lg">
            + 放大
        </button>
    </div>

    <div class="poster-wrapper" id="poster-wrapper">
        <div id="poster">
            <div class="bg-pattern"></div>
            
            <!-- 背景浮水印大字 -->
            <div class="bg-text" id="bg-title">中苗小區</div>

            <!-- 標題區 -->
            <div class="absolute top-16 w-full text-center z-30">
                <p class="text-white text-xl tracking-[0.3em] mb-2 font-semibold">真耶穌教會臺灣傳教百週年</p>
                <h2 class="text-brand-gold text-6xl font-black tracking-[0.2em]" style="text-shadow: 0 4px 10px rgba(0,0,0,0.5);">西區音樂會</h2>
            </div>

            <!-- 動態生成內容的容器 -->
            <div id="dynamic-content">
                <!-- 泡泡與地標將由 JS 動態注入 -->
            </div>

            <!-- SVG 曲線繪製區 -->
            <svg id="connections"></svg>

            <!-- 底部文字 -->
            <div class="absolute bottom-12 w-full text-center z-30">
                <p class="text-brand-gold text-sm tracking-[0.4em] uppercase font-semibold">True Jesus Church 100th Anniversary</p>
            </div>
        </div>
    </div>

    <script>
        // 記錄目前的縮放比例
        let currentScale = window.innerHeight > 1000 ? 1 : 0.6; // 根據螢幕高度給初始值
        
        // ==========================================
        // 佈局資料定義 (基於截圖還原中苗小區的相對位置)
        // x, y 代表在 800x1422 畫布上的百分比位置
        // ==========================================
        const zonesData = {
       fuxing: {
                name: "復興小區",
                id: "fuxing",
                churches: [
                    { name: "八德教會", lat: 24.934632, lng: 121.299978, photo: "assets/photos/fuxing/bade.jpg", showPhoto: true },
                    { name: "崎頂教會", lat: 24.900432, lng: 121.282682, photo: "assets/photos/fuxing/qiding.jpg", showPhoto: true },
                    { name: "大溪教會", lat: 24.881231, lng: 121.294548, photo: "assets/photos/fuxing/daxi.jpg", showPhoto: true },
                    { name: "復興教會", lat: 24.826416, lng: 121.356914, photo: "assets/photos/fuxing/fuxing.jpg", showPhoto: true },
                    { name: "義盛教會", lat: 24.779475, lng: 121.365940, photo: "assets/photos/fuxing/yisheng.jpg", showPhoto: true },
                    { name: "大灣祈禱所", lat: 24.760693, lng: 121.344903, photo: "assets/photos/fuxing/dawan.jpg", showPhoto: true },
                    { name: "雪霧鬧祈禱所", lat: 24.741287, lng: 121.365961, photo: "assets/photos/fuxing/xuewunao.jpg", showPhoto: true },
                    { name: "上巴陵教會", lat: 24.685697, lng: 121.396455, photo: "assets/photos/fuxing/shangbaling.jpg", showPhoto: true },
                    { name: "中巴陵", lat: 24.679721, lng: 121.396892, showPhoto: false },
                    { name: "三光", lat: 24.675178, lng: 121.366111, showPhoto: false },
                    { name: "光華", lat: 24.665251, lng: 121.398561, showPhoto: false }
                ]
            },
            zhumiao: {
                name: "竹苗小區",
                id: "zhumiao",
                churches: [
                    { name: "花園教會", lat: 24.645038, lng: 121.151893, photo: "assets/photos/zhumiao/huayuan.jpg", showPhoto: true },
                    { name: "五峰教會", lat: 24.629047, lng: 121.119750, photo: "assets/photos/zhumiao/wufeng.jpg", showPhoto: true },
                    { name: "桃山教會", lat: 24.599219, lng: 121.109834, photo: "assets/photos/zhumiao/taoshan.jpg", showPhoto: true },
                    { name: "清泉教會", lat: 24.578934, lng: 121.106060, photo: "assets/photos/zhumiao/qingquan.jpg", showPhoto: true },
                    { name: "義興教會", lat: 24.683555, lng: 121.185258, photo: "assets/photos/zhumiao/yixing.jpg", showPhoto: true },
                    { name: "錦屏教會", lat: 24.695765, lng: 121.227790, photo: "assets/photos/zhumiao/jinping.jpg", showPhoto: true },
                    { name: "尖石教會", lat: 24.720930, lng: 121.214883, photo: "assets/photos/zhumiao/jianshi.jpg", showPhoto: true }
                ]
            },
            zhongmiao: {
                name: "中苗小區",
                id: "zhongmiao",
                churches: [
                    { name: "東勢教會", lat: 24.249405, lng: 120.832019, photo: "assets/photos/zhongmiao/dongshi.jpg", showPhoto: true },
                    { name: "自由教會", lat: 24.270630, lng: 120.890200, photo: "assets/photos/zhongmiao/ziyou.jpg", showPhoto: true },
                    { name: "雙崎教會", lat: 24.290980, lng: 120.908350, photo: "assets/photos/zhongmiao/shuangqi.jpg", showPhoto: true },
                    { name: "達觀教會", lat: 24.321900, lng: 120.921956, photo: "assets/photos/zhongmiao/daguan.jpg", showPhoto: true },
                    { name: "南勢教會", lat: 24.170876, lng: 120.896805, photo: "assets/photos/zhongmiao/nanshi.jpg", showPhoto: true },
                    { name: "裡冷教會", lat: 24.164515, lng: 120.952551, photo: "assets/photos/zhongmiao/lileng.jpg", showPhoto: true },
                    { name: "博愛教會", lat: 24.174447, lng: 120.978225, photo: "assets/photos/zhongmiao/boai.jpg", showPhoto: true }
                ]
            },
            nantou: {
                name: "南投小區",
                id: "nantou",
                churches: [
                    { name: "翠巒教會", lat: 24.182960, lng: 121.204100, photo: "assets/photos/nantou/cuiluan.jpg", showPhoto: true },
                    { name: "力行教會", lat: 24.148459, lng: 121.190195, photo: "assets/photos/nantou/lixing.jpg", showPhoto: true },
                    { name: "紅香教會", lat: 24.159071, lng: 121.176026, photo: "assets/photos/nantou/hongxiang.jpg", showPhoto: true },
                    { name: "慈峰教會", lat: 24.131208, lng: 121.184243, photo: "assets/photos/nantou/cifeng.jpg", showPhoto: true },
                    { name: "精英教會", lat: 24.061304, lng: 121.194630, photo: "assets/photos/nantou/jingying.jpg", showPhoto: true },
                    { name: "廬山教會", lat: 24.033899, lng: 121.185267, photo: "assets/photos/nantou/lushan.jpg", showPhoto: true },
                    { name: "春陽教會", lat: 24.027045, lng: 121.149445, photo: "assets/photos/nantou/chunyang.jpg", showPhoto: true }
                ]
            }
        };
        function init() {
            // 設定初始縮放
            document.getElementById('poster-wrapper').style.transform = `scale(${currentScale})`;
            renderPoster();
        }

        function zoomPoster(delta) {
            currentScale += delta;
            // 限制縮放範圍
            if (currentScale < 0.3) currentScale = 0.3;
            if (currentScale > 1.5) currentScale = 1.5;
            document.getElementById('poster-wrapper').style.transform = `scale(${currentScale})`;
        }

        function renderPoster() {
            const zoneKey = document.getElementById('zone-select').value;
            const data = zonesData[zoneKey];
            
            // 更新背景文字
            document.getElementById('bg-title').innerText = data.name;

            const container = document.getElementById('dynamic-content');
            const svgLayer = document.getElementById('connections');
            
            // 清空內容
            container.innerHTML = '';
            svgLayer.innerHTML = '';

            const posterW = 800;
            const posterH = 1422;

            // 遍歷所有節點資料
            data.nodes.forEach(node => {
                // 1. 計算絕對座標 (供 SVG 連線使用)
                const blobAbsX = posterW * (node.blob.x / 100);
                const blobAbsY = posterH * (node.blob.y / 100);
                const pinAbsX = posterW * (node.pin.x / 100);
                // pin 的 Y 座標我們視為 icon 的底部，連線可以稍微高一點連到 icon 內部
                const pinAbsY = (posterH * (node.pin.y / 100)) - 25; 

                // 2. 建立泡泡 (Blob)
                const blobDiv = document.createElement('div');
                blobDiv.className = `blob ${node.blob.class}`;
                blobDiv.style.left = `calc(${node.blob.x}% - ${blobDiv.style.width || '100px'})`;
                // 使用 transform 置中定位點
                blobDiv.style.transform = 'translate(-50%, -50%)';
                blobDiv.style.left = `${node.blob.x}%`;
                blobDiv.style.top = `${node.blob.y}%`;
                blobDiv.innerHTML = `<span>[?][?][?][?]</span>`;
                container.appendChild(blobDiv);

                // 3. 建立地標 (Pin)
                const pinDiv = document.createElement('div');
                pinDiv.className = 'pin-container';
                pinDiv.style.left = `${node.pin.x}%`;
                pinDiv.style.top = `${node.pin.y}%`;
                pinDiv.innerHTML = `
                    <i class="fa-solid fa-location-dot pin-icon"></i>
                    <div class="pin-label">${node.name}</div>
                `;
                container.appendChild(pinDiv);

                // 4. 繪製 SVG 連線 (二次貝茲曲線 Q)
                // 為了讓線條看起來像截圖一樣集中在中間，我們動態計算控制點 (Control Point)
                // 控制點 x 設在兩者中間偏左/右，y 設在中間
                let cpX = (blobAbsX + pinAbsX) / 2;
                let cpY = (blobAbsY + pinAbsY) / 2;
                
                // 針對不同位置加入一些隨機或特定的偏移，讓曲線更生動 (模擬截圖的效果)
                if (node.blob.y < 50 && node.pin.y > 50) {
                    cpX -= 100; // 跨越上半到下半的線，控制點往左拉
                } else if (node.blob.y > 50 && node.pin.y > 50) {
                    cpX += 50;  // 都在下半部的線，控制點微調
                }

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const d = `M ${blobAbsX} ${blobAbsY} Q ${cpX} ${cpY} ${pinAbsX} ${pinAbsY}`;
                path.setAttribute('d', d);
                path.setAttribute('class', 'connection-line');
                svgLayer.appendChild(path);
            });
        }

        // 啟動
        window.onload = init;
    </script>
</body>
</html>
