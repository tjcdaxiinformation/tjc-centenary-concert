<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海報產生器 (預覽)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
    <!-- Font Awesome for map marker icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#141824', // 外圍背景色
                            posterBg: '#131e33', // 海報深藍色
                            gold: '#dfb754',
                            text: '#f3f4f6'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #141824;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Noto Serif TC', serif;
            margin: 0;
            min-height: 100vh;
        }

        /* 頂部工具列 */
        .toolbar {
            width: 100%;
            background-color: #1a2235;
            border-bottom: 1px solid #334155;
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* 鎖定海報比例 (直式 9:16 或類似尺寸) */
        .poster-wrapper {
            margin-top: 2rem;
            margin-bottom: 4rem;
            transform-origin: top center;
            transition: transform 0.2s ease-out;
        }

        #poster {
            width: 800px;
            height: 1422px; /* 16:9 ratio */
            position: relative;
            background: linear-gradient(180deg, #0d1527 0%, #152039 100%);
            color: white;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 背景網點裝飾 */
        .bg-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        /* 背景垂直大字 */
        .bg-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.05);
            writing-mode: vertical-rl;
            text-orientation: upright;
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: -2rem;
        }

        /* 不規則泡泡樣式 */
        .blob {
            position: absolute;
            border: 2px solid #dfb754;
            background: rgba(30, 41, 59, 0.7);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #dfb754;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 0.2rem;
            z-index: 20;
            transition: all 0.3s ease;
        }

        /* 產生不規則形狀 */
        .blob-1 { border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%; width: 220px; height: 130px; }
        .blob-2 { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; width: 200px; height: 140px; }
        .blob-3 { border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%; width: 210px; height: 130px; }
        .blob-4 { border-radius: 40% 60% 50% 50% / 50% 50% 60% 40%; width: 230px; height: 140px; }

        /* 地標與名稱標籤 */
        .pin-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            transform: translate(-50%, -100%); /* 將定位點設在圖標底部中心 */
        }
        
        .pin-icon {
            color: #dfb754;
            font-size: 1.8rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            margin-bottom: 4px;
        }

        .pin-label {
            background-color: #1a2235;
            border: 1px solid #dfb754;
            color: #f3f4f6;
            padding: 2px 8px;
            font-size: 0.85rem;
            border-radius: 4px;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* SVG 連線層 */
        #connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .connection-line {
            fill: none;
            stroke: #dfb754;
            stroke-width: 3;
            stroke-dasharray: 6 6;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <h1 class="text-brand-gold text-2xl font-bold tracking-wider mr-4">海報產生器 (預覽)</h1>
        
    <!-- 區域選擇下拉選單 -->
        <div class="relative">
            <select id="zone-select" onchange="renderPoster()" class="appearance-none bg-[#1e293b] border border-brand-gold text-brand-gold py-2 pl-4 pr-10 rounded text-lg font-bold focus:outline-none cursor-pointer">
                <option value="zhongmiao">中苗小區</option>
                <option value="fuxing">復興小區</option>
                <option value="zhumiao">竹苗小區</option>
                <option value="nantou">南投小區</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-brand-gold">
                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
            </div>
        </div>
        
        <!-- 縮放控制按鈕 (移回工具列並修復標籤錯誤) -->
        <button onclick="zoomPoster(-0.1)" class="bg-[#334155] hover:bg-[#475569] text-white px-4 py-2 rounded transition-colors text-lg">
            - 縮小
        </button>
        <button onclick="zoomPoster(0.1)" class="bg-[#334155] hover:bg-[#475569] text-white px-4 py-2 rounded transition-colors text-lg">
            + 放大
        </button>
    </div> <!-- 正確關閉 toolbar -->

    <!-- 海報預覽區 -->
    <div class="mt-8 flex justify-center w-full overflow-hidden mb-12">
        <div id="poster-container" class="relative w-[1200px] h-[800px] bg-[#0f172a] shadow-2xl rounded-xl overflow-hidden shrink-0 font-sans border border-slate-700 transition-transform duration-200" style="transform-origin: top center;">
            <!-- SVG 連接線層 (放置於底層以防遮擋互動) -->
            <svg id="lines-layer" class="absolute inset-0 w-full h-full pointer-events-none z-10"></svg>
            
            <!-- 左半部：教會照片層 -->
            <div id="photos-layer" class="absolute left-0 top-0 w-1/2 h-full z-20 pointer-events-none"></div>
            
            <!-- 右半部：地圖與標籤層 -->
            <div id="map-layer" class="absolute right-0 top-0 w-1/2 h-full z-20 pointer-events-none relative">
                <!-- 地圖背景裝飾 (深色漸層) -->
                <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 via-[#0f172a] to-[#0f172a] opacity-50"></div>
            </div>
        </div>
    </div>

    <script>
        // 記錄目前的縮放比例
        let currentScale = window.innerHeight > 1000 ? 1 : 0.7;
        
        // 縮放海報功能
        function zoomPoster(delta) {
            currentScale += delta;
            // 限制縮放最大/最小值
            if (currentScale < 0.3) currentScale = 0.3;
            if (currentScale > 2) currentScale = 2;
            document.getElementById('poster-container').style.transform = `scale(${currentScale})`;
        }

        // ==========================================
        // 佈局資料定義 (基於截圖還原中苗小區的相對位置)
        // x, y 代表在 800x1422 畫布上的百分比位置
        // ==========================================
        const zonesData = {
            fuxing: {
                name: "復興小區",
                id: "fuxing",
                churches: [
                    { name: "八德教會", lat: 24.934632, lng: 121.299978, photo: "assets/fuxing/八德教會.jpg", showPhoto: true },
                    { name: "崎頂教會", lat: 24.900432, lng: 121.282682, photo: "assets/fuxing/崎頂教會.jpg", showPhoto: true },
                    { name: "大溪教會", lat: 24.881231, lng: 121.294548, photo: "assets/uxing/大溪教會.jpg", showPhoto: true },
                    { name: "復興教會", lat: 24.826416, lng: 121.356914, photo: "assets/fuxing/復興教會.jpg", showPhoto: true },
                    { name: "義盛教會", lat: 24.779475, lng: 121.365940, photo: "assets/fuxing/義盛教會.jpg", showPhoto: true },
                    { name: "大灣教會", lat: 24.760693, lng: 121.344903, photo: "assets/fuxing/大灣教會.jpg", showPhoto: true },
                    { name: "雪霧鬧教會", lat: 24.741287, lng: 121.365961, photo: "assets/fuxing/雪霧鬧教會.jpg", showPhoto: true },
                    { name: "上巴陵教會", lat: 24.685697, lng: 121.396455, photo: "assets/fuxing/上巴陵教會.jpg", showPhoto: true },
                    { name: "中巴陵", lat: 24.679721, lng: 121.396892, photo: "assets/fuxing/中巴陵教會.jpg", showPhoto: false },
                    { name: "三光", lat: 24.675178, lng: 121.366111, photo: "assets/fuxing/三光教會.jpg", showPhoto: false },
                    { name: "光華", lat: 24.665251, lng: 121.398561, photo: "assets/fuxing/光華教會.jpg", showPhoto: false }
                ]
            },
            zhumiao: {
                name: "竹苗小區",
                id: "zhumiao",
                churches: [
                    { name: "花園教會", lat: 24.645038, lng: 121.151893, photo: "assets/photos/zhumiao/huayuan.jpg", showPhoto: true },
                    { name: "五峰教會", lat: 24.629047, lng: 121.119750, photo: "assets/photos/zhumiao/wufeng.jpg", showPhoto: true },
                    { name: "桃山教會", lat: 24.599219, lng: 121.109834, photo: "assets/photos/zhumiao/taoshan.jpg", showPhoto: true },
                    { name: "清泉教會", lat: 24.578934, lng: 121.106060, photo: "assets/photos/zhumiao/qingquan.jpg", showPhoto: true },
                    { name: "義興教會", lat: 24.683555, lng: 121.185258, photo: "assets/photos/zhumiao/yixing.jpg", showPhoto: true },
                    { name: "錦屏教會", lat: 24.695765, lng: 121.227790, photo: "assets/photos/zhumiao/jinping.jpg", showPhoto: true },
                    { name: "尖石教會", lat: 24.720930, lng: 121.214883, photo: "assets/photos/zhumiao/jianshi.jpg", showPhoto: true }
                ]
            },
            zhongmiao: {
                name: "中苗小區",
                id: "zhongmiao",
                churches: [
                    { name: "東勢教會", lat: 24.249405, lng: 120.832019, photo: "assets/photos/zhongmiao/dongshi.jpg", showPhoto: true },
                    { name: "自由教會", lat: 24.270630, lng: 120.890200, photo: "assets/photos/zhongmiao/ziyou.jpg", showPhoto: true },
                    { name: "雙崎教會", lat: 24.290980, lng: 120.908350, photo: "assets/photos/zhongmiao/shuangqi.jpg", showPhoto: true },
                    { name: "達觀教會", lat: 24.321900, lng: 120.921956, photo: "assets/photos/zhongmiao/daguan.jpg", showPhoto: true },
                    { name: "南勢教會", lat: 24.170876, lng: 120.896805, photo: "assets/photos/zhongmiao/nanshi.jpg", showPhoto: true },
                    { name: "裡冷教會", lat: 24.164515, lng: 120.952551, photo: "assets/photos/zhongmiao/lileng.jpg", showPhoto: true },
                    { name: "博愛教會", lat: 24.174447, lng: 120.978225, photo: "assets/photos/zhongmiao/boai.jpg", showPhoto: true }
                ]
            },
            nantou: {
                name: "南投小區",
                id: "nantou",
                churches: [
                    { name: "翠巒教會", lat: 24.182960, lng: 121.204100, photo: "assets/photos/nantou/cuiluan.jpg", showPhoto: true },
                    { name: "力行教會", lat: 24.148459, lng: 121.190195, photo: "assets/photos/nantou/lixing.jpg", showPhoto: true },
                    { name: "紅香教會", lat: 24.159071, lng: 121.176026, photo: "assets/photos/nantou/hongxiang.jpg", showPhoto: true },
                    { name: "慈峰教會", lat: 24.131208, lng: 121.184243, photo: "assets/photos/nantou/cifeng.jpg", showPhoto: true },
                    { name: "精英教會", lat: 24.061304, lng: 121.194630, photo: "assets/photos/nantou/jingying.jpg", showPhoto: true },
                    { name: "廬山教會", lat: 24.033899, lng: 121.185267, photo: "assets/photos/nantou/lushan.jpg", showPhoto: true },
      { name: "春陽教會", lat: 24.027045, lng: 121.149445, photo: "assets/photos/nantou/chunyang.jpg", showPhoto: true }
                ]
            }
        };

        function renderPoster() {
            const zoneId = document.getElementById("zone-select").value;
            const zone = zonesData[zoneId];
            if (!zone) return;

            const mapLayer = document.getElementById("map-layer");
            const photosLayer = document.getElementById("photos-layer");
            const linesLayer = document.getElementById("lines-layer");

            // 清空舊內容 (保留地圖背景裝飾)
            mapLayer.innerHTML = '<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 via-[#0f172a] to-[#0f172a] opacity-50"></div>';
            photosLayer.innerHTML = '';
            linesLayer.innerHTML = '';

            const churches = zone.churches;
            if (churches.length === 0) return;

            let minLat = Infinity, maxLat = -Infinity;
            let minLng = Infinity, maxLng = -Infinity;
            
            churches.forEach(c => {
                if (c.lat < minLat) minLat = c.lat;
                if (c.lat > maxLat) maxLat = c.lat;
                if (c.lng < minLng) minLng = c.lng;
                if (c.lng > maxLng) maxLng = c.lng;
            });

            // 避免座標相同時除以零
            if (maxLat === minLat) { maxLat += 0.01; minLat -= 0.01; }
            if (maxLng === minLng) { maxLng += 0.01; minLng -= 0.01; }

            // 海報尺寸基礎設定
            const posterWidth = 1200;
            const posterHeight = 800;
            const mapOffsetX = posterWidth / 2; // 右半部起點 (寬度一半)

            const photoChurches = churches.filter(c => c.showPhoto);
            const numPhotos = photoChurches.length;

            churches.forEach((church) => {
                // === 計算右半部地標位置 ===
                // 留出 20% Padding 防止地標貼邊
                const paddingX = mapOffsetX * 0.2;
                const paddingY = posterHeight * 0.2;
                const usableMapW = mapOffsetX - paddingX * 2;
                const usableMapH = posterHeight - paddingY * 2;

                // 經度(Lng)映射到 X 軸，緯度(Lat)映射到 Y 軸 (緯度越高地理越北，故網頁 Y 軸反轉)
                const normX = (church.lng - minLng) / (maxLng - minLng);
                const normY = 1 - ((church.lat - minLat) / (maxLat - minLat));

                const mapX = paddingX + normX * usableMapW;
                const mapY = paddingY + normY * usableMapH;

                // 建立地標元素
                const marker = document.createElement("div");
                marker.className = "absolute flex flex-col items-center justify-center transform -translate-x-1/2 -translate-y-1/2 drop-shadow-lg z-30";
                marker.style.left = `${mapX}px`;
                marker.style.top = `${mapY}px`;
                marker.innerHTML = `
                    <div class="w-3 h-3 bg-yellow-400 rounded-full shadow-[0_0_12px_rgba(250,204,21,1)] border border-white"></div>
                    <div class="mt-2 text-yellow-100 font-bold text-sm tracking-widest whitespace-nowrap bg-black/60 px-3 py-1 rounded-full backdrop-blur-md border border-white/20">${church.name}</div>
                `;
                mapLayer.appendChild(marker);

                // === 計算左半部照片位置 ===
                if (church.showPhoto) {
                    const photoIndex = photoChurches.indexOf(church);
                    
                    // Y軸分區排列並加入亂數偏移，營出租落交疊感
                    const sectionH = posterHeight / numPhotos;
                    const baseY = sectionH * photoIndex + sectionH / 2;
                    const photoY = baseY + (Math.random() - 0.5) * (sectionH * 0.6);
                    
                    // X軸交錯排列 (偶數靠左，奇數靠右)
                    const baseX = (photoIndex % 2 === 0) ? mapOffsetX * 0.35 : mapOffsetX * 0.65;
                    const photoX = baseX + (Math.random() - 0.5) * (mapOffsetX * 0.25);

                    // 大小不一：隨機產生 160px ~ 280px 大小
                    const size = 160 + Math.random() * 120;

                    const photoEl = document.createElement("div");
                    photoEl.className = "absolute transform -translate-x-1/2 -translate-y-1/2 bg-cover bg-center transition-all duration-700 hover:scale-110 hover:z-40 cursor-pointer pointer-events-auto group";
                    photoEl.style.width = `${size}px`;
                    photoEl.style.height = `${size}px`;
                    photoEl.style.left = `${photoX}px`;
                    photoEl.style.top = `${photoY}px`;
                    photoEl.style.zIndex = Math.floor(Math.random() * 10) + 10;
                    
                    // 備用底圖機制（若無圖可用漸層色取代）
                    photoEl.style.backgroundColor = '#1e293b'; 
                    photoEl.style.backgroundImage = `url('${church.photo}'), linear-gradient(45deg, #1e293b, #334155)`;
                    
                    // 關鍵：使用 mask-image 做出邊緣透明無邊線、淡入淡出感
                    photoEl.style.WebkitMaskImage = "radial-gradient(circle at center, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%)";
                    photoEl.style.maskImage = "radial-gradient(circle at center, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%)";
                    
                    // 加上名稱懸浮提示 (Hover 時顯示)
                    photoEl.innerHTML = `<div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <span class="bg-black/70 text-white px-3 py-1 rounded-full text-sm font-bold tracking-wider">${church.name}</span>
                    </div>`;

                    photosLayer.appendChild(photoEl);

                    // 全域座標換算: 左側的圖(X) 連到 右側的地標(X + mapOffsetX)
                    const absoluteMapX = mapOffsetX + mapX;
                    const absoluteMapY = mapY;
                    
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', photoX);
                    line.setAttribute('y1', photoY);
                    line.setAttribute('x2', absoluteMapX);
                    line.setAttribute('y2', absoluteMapY);
                    line.setAttribute('stroke', 'rgba(250, 204, 21, 0.4)'); // 半透明黃金色
                    line.setAttribute('stroke-width', '1.5');
                    line.setAttribute('stroke-dasharray', '6, 6');
                    
                    // 動畫: 讓虛線有流動感
                    line.innerHTML = `<animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite" />`;
                    
                    linesLayer.appendChild(line);
                }
            });
        }

  // 初始化載入時繪製
        window.addEventListener('DOMContentLoaded', () => {
            // 初始設定一次縮放
            document.getElementById('poster-container').style.transform = `scale(${currentScale})`;
            renderPoster();
        });
    </script>
</body>
</html>
