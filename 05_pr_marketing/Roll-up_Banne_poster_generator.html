<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易拉寶海報產生器 - 西區教會分佈</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS & JS for Interactive Map rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0B0F19',
                            panel: '#151D2A',
                            gold: '#DFB754',
                            goldLight: '#F3D685',
                            accent: '#38BDF8',
                            darkText: '#94A3B8'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 頂部固定工具列 */
        .sticky-toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background-color: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid rgba(223, 183, 84, 0.2);
        }

        /* 易拉寶 H 架 比例 (60 x 160 cm => 600px x 1600px) */
        .poster-canvas {
            width: 600px;
            height: 1600px;
            position: relative;
            background-color: #0d1527;
            /* 預設載入主目錄『主視覺.jpg』，備用深色質感漸層 */
            background-image: url('主視覺.jpg'), linear-gradient(180deg, #090e18 0%, #111a2e 50%, #080c14 100%);
            background-size: cover;
            background-position: center;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 30px rgba(223, 183, 84, 0.15);
            overflow: hidden;
            transform-origin: top center;
            transition: transform 0.25s ease-out;
        }

        /* 暗色地圖自訂濾鏡：使 OpenStreetMap 地形與行政區地圖融入海報氛圍 */
        .leaflet-container {
            background: transparent !important;
        }
        .dark-map-tiles .leaflet-tile {
            filter: brightness(0.65) invert(1) contrast(1.3) hue-rotate(200deg) saturate(0.4) !important;
        }

        /* Leaflet 控制項隱藏與重設 */
        .leaflet-control-attribution, .leaflet-control-zoom {
            display: none !important;
        }

        /* 照片羽化遮罩與浮動動畫 */
        .photo-bubble {
            mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 72%);
            -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 72%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .photo-bubble:hover {
            transform: scale(1.15) translateZ(0);
            z-index: 60 !important;
        }

        /* 自訂地圖標記 (Church Pin Marker) */
        .custom-church-pin {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .pin-head {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #dfb754, #b8860b);
            border: 2px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 12px rgba(223, 183, 84, 0.8);
        }
        .pin-head i {
            transform: rotate(45deg);
            color: #0b0f19;
            font-size: 13px;
        }
        .pin-label {
            margin-top: 4px;
            background: rgba(11, 15, 25, 0.85);
            border: 1px solid rgba(223, 183, 84, 0.6);
            color: #f3d685;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 12px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }

        /* 滾動條美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- 控制列 -->
    <header class="sticky-toolbar w-full px-6 py-4 flex flex-wrap items-center justify-between gap-4 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-brand-gold/20 border border-brand-gold flex items-center justify-center text-brand-gold font-bold text-xl">
                <i class="fa-solid fa-map-location-dot"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-brand-gold tracking-wide font-serif">易拉寶海報產生器</h1>
                <p class="text-xs text-brand-darkText">直式 H 架規格 (60×160cm) • 動態地形圖與座標標註</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <!-- 區域選擇 -->
            <div class="flex items-center gap-2 bg-brand-panel border border-brand-gold/40 px-3 py-1.5 rounded-lg">
                <label for="zone-select" class="text-xs text-brand-gold font-bold">選擇小區：</label>
                <select id="zone-select" onchange="renderPoster()" class="bg-transparent text-white font-bold focus:outline-none cursor-pointer text-sm">
                    <option value="fuxing" class="bg-slate-900">復興小區</option>
                    <option value="zhongmiao" class="bg-slate-900">中苗小區</option>
                    <option value="zhumiao" class="bg-slate-900">竹苗小區</option>
                    <option value="nantou" class="bg-slate-900">南投小區</option>
                </select>
            </div>

            <!-- 底圖來源說明提示 -->
            <div class="hidden md:flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 text-xs text-slate-300">
                <i class="fa-solid fa-image text-brand-gold"></i>
                <span>底圖：<code class="text-brand-goldLight">主視覺.jpg</code></span>
            </div>

            <!-- 縮放按鈕 -->
            <div class="flex items-center bg-slate-800 rounded-lg p-1 border border-slate-700">
                <button onclick="zoomPoster(-0.08)" class="px-3 py-1 text-slate-300 hover:text-white hover:bg-slate-700 rounded transition-colors text-sm font-bold" title="縮小預覽">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <span id="scale-indicator" class="px-2 text-xs text-brand-gold font-mono font-bold">50%</span>
                <button onclick="zoomPoster(0.08)" class="px-3 py-1 text-slate-300 hover:text-white hover:bg-slate-700 rounded transition-colors text-sm font-bold" title="放大預覽">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button onclick="resetZoom()" class="px-2 py-1 text-xs text-slate-400 hover:text-white border-l border-slate-700 ml-1" title="適應螢幕">
                    重置
                </button>
            </div>

            <!-- 重新排列按鈕 -->
            <button onclick="renderPoster()" class="bg-brand-gold hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg transition-all text-sm shadow-md flex items-center gap-1.5">
                <i class="fa-solid fa-arrows-rotate"></i>
                <span>刷新版面</span>
            </button>
        </div>
    </header>

    <!-- 海報畫布工作區 -->
    <main class="w-full flex justify-center py-10 px-4 overflow-auto">
        <div class="poster-wrapper">
            <div id="poster" class="poster-canvas rounded-sm">
                <!-- SVG 連線層 (鋪滿全畫布) -->
                <svg id="svg-connections" class="absolute inset-0 w-full h-full pointer-events-none z-30"></svg>

                <!-- 上半部：標題與相片集區塊 (0px ~ 900px) -->
                <div id="header-section" class="absolute top-0 left-0 w-full h-[320px] p-8 z-40 flex flex-col justify-between pointer-events-none">
                    <div class="space-y-2">
                        <div class="inline-block px-3 py-1 rounded-full bg-brand-gold/20 border border-brand-gold/60 text-brand-gold text-xs tracking-widest font-bold">
                            TAYAL PRESBYTERY CHURCH MAP
                        </div>
                        <h2 id="poster-title" class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-100 via-amber-300 to-amber-500 font-serif tracking-wider drop-shadow-md">
                            復興小區教會分佈圖
                        </h2>
                        <p id="poster-subtitle" class="text-slate-300 text-sm tracking-wide font-serif opacity-90">
                            足跡與信仰之光 • 主恩滿溢
                        </p>
                    </div>
                </div>

                <!-- 相片泡泡浮動層 (0px ~ 950px) -->
                <div id="photos-container" class="absolute inset-0 w-full h-[950px] pointer-events-none z-20"></div>

                <!-- 下半部：Leaflet 動態地形與行政區地圖 (850px ~ 1550px) -->
                <div class="absolute bottom-[40px] left-[30px] w-[540px] h-[680px] rounded-2xl overflow-hidden border-2 border-brand-gold/50 shadow-2xl z-20 bg-slate-950/80 backdrop-blur-sm">
                    <!-- 地圖標題列 -->
                    <div class="absolute top-0 inset-x-0 h-10 bg-gradient-to-b from-slate-950/90 to-transparent z-10 pointer-events-none flex items-center justify-between px-4">
                        <span id="map-area-tag" class="text-xs text-brand-gold font-bold tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-layer-group"></i> 地形與行政區域衛星地圖
                        </span>
                        <span class="text-[10px] text-slate-400">OpenStreetMap / Terrain</span>
                    </div>

                    <!-- Leaflet 地圖容器 -->
                    <div id="leaflet-map" class="w-full h-full dark-map-tiles z-0"></div>
                    
                    <!-- 地圖外框金邊裝飾角 -->
                    <div class="absolute top-2 left-2 w-4 h-4 border-t-2 border-l-2 border-brand-gold pointer-events-none z-10"></div>
                    <div class="absolute top-2 right-2 w-4 h-4 border-t-2 border-r-2 border-brand-gold pointer-events-none z-10"></div>
                    <div class="absolute bottom-2 left-2 w-4 h-4 border-b-2 border-l-2 border-brand-gold pointer-events-none z-10"></div>
                    <div class="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-brand-gold pointer-events-none z-10"></div>
                </div>

                <!-- 頁尾資訊塊 (底部裝飾標籤) -->
                <div class="absolute bottom-0 inset-x-0 h-10 bg-slate-950/90 border-t border-brand-gold/30 flex items-center justify-between px-8 text-[11px] text-slate-400 z-40 font-serif">
                    <span>真耶穌教會西區各教會</span>
                    <span id="footer-count-text" class="text-brand-gold">共收錄 11 所教會</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // 各小區教會完整數據 (包含座標與照片)
        // ==========================================
        const zonesData = {
            fuxing: {
                name: "復興小區",
                title: "復興小區教會巡禮",
                subtitle: "山川縱谷間的福音燈臺 • 泰雅爾足跡",
                churches: [
                    { name: "八德教會", lat: 24.934632, lng: 121.299978, photo: "assets/fuxing/八德教會.jpg", showPhoto: true },
                    { name: "崎頂教會", lat: 24.900432, lng: 121.282682, photo: "assets/fuxing/崎頂教會.jpg", showPhoto: true },
                    { name: "大溪教會", lat: 24.881231, lng: 121.294548, photo: "assets/fuxing/大溪教會.jpg", showPhoto: true },
                    { name: "復興教會", lat: 24.826416, lng: 121.356914, photo: "assets/fuxing/復興教會.jpg", showPhoto: true },
                    { name: "義盛教會", lat: 24.779475, lng: 121.365940, photo: "assets/fuxing/義盛教會.jpg", showPhoto: true },
                    { name: "大灣教會", lat: 24.760693, lng: 121.344903, photo: "assets/fuxing/大灣教會.jpg", showPhoto: true },
                    { name: "雪霧鬧教會", lat: 24.741287, lng: 121.365961, photo: "assets/fuxing/雪霧鬧教會.jpg", showPhoto: true },
                    { name: "上巴陵教會", lat: 24.685697, lng: 121.396455, photo: "assets/fuxing/上巴陵教會.jpg", showPhoto: true },
                    { name: "中巴陵教會", lat: 24.679721, lng: 121.396892, photo: "assets/fuxing/中巴陵教會.jpg", showPhoto: true },
                    { name: "三光教會", lat: 24.675178, lng: 121.366111, photo: "assets/fuxing/三光教會.jpg", showPhoto: true },
                    { name: "光華教會", lat: 24.665251, lng: 121.398561, photo: "assets/fuxing/光華教會.jpg", showPhoto: true }
                ]
            },
            zhumiao: {
                name: "竹苗小區",
                title: "竹苗小區教會分佈圖",
                subtitle: "深山峽谷之光的堅固堡壘",
                churches: [
                    { name: "花園教會", lat: 24.645038, lng: 121.151893, photo: "assets/photos/zhumiao/huayuan.jpg", showPhoto: true },
                    { name: "五峰教會", lat: 24.629047, lng: 121.119750, photo: "assets/photos/zhumiao/wufeng.jpg", showPhoto: true },
                    { name: "桃山教會", lat: 24.599219, lng: 121.109834, photo: "assets/photos/zhumiao/taoshan.jpg", showPhoto: true },
                    { name: "清泉教會", lat: 24.578934, lng: 121.106060, photo: "assets/photos/zhumiao/qingquan.jpg", showPhoto: true },
                    { name: "義興教會", lat: 24.683555, lng: 121.185258, photo: "assets/photos/zhumiao/yixing.jpg", showPhoto: true },
                    { name: "錦屏教會", lat: 24.695765, lng: 121.227790, photo: "assets/photos/zhumiao/jinping.jpg", showPhoto: true },
                    { name: "尖石教會", lat: 24.720930, lng: 121.214883, photo: "assets/photos/zhumiao/jianshi.jpg", showPhoto: true }
                ]
            },
            zhongmiao: {
                name: "中苗小區",
                title: "中苗小區教會分佈圖",
                subtitle: "大甲溪畔與群山圍繞的恩典部落",
                churches: [
                    { name: "東勢教會", lat: 24.249405, lng: 120.832019, photo: "assets/photos/zhongmiao/dongshi.jpg", showPhoto: true },
                    { name: "自由教會", lat: 24.270630, lng: 120.890200, photo: "assets/photos/zhongmiao/ziyou.jpg", showPhoto: true },
                    { name: "雙崎教會", lat: 24.290980, lng: 120.908350, photo: "assets/photos/zhongmiao/shuangqi.jpg", showPhoto: true },
                    { name: "達觀教會", lat: 24.321900, lng: 120.921956, photo: "assets/photos/zhongmiao/daguan.jpg", showPhoto: true },
                    { name: "南勢教會", lat: 24.170876, lng: 120.896805, photo: "assets/photos/zhongmiao/nanshi.jpg", showPhoto: true },
                    { name: "裡冷教會", lat: 24.164515, lng: 120.952551, photo: "assets/photos/zhongmiao/lileng.jpg", showPhoto: true },
                    { name: "博愛教會", lat: 24.174447, lng: 120.978225, photo: "assets/photos/zhongmiao/boai.jpg", showPhoto: true }
                ]
            },
            nantou: {
                name: "南投小區",
                title: "南投小區教會分佈圖",
                subtitle: "濁水溪源頭的榮耀之光",
                churches: [
                    { name: "翠巒教會", lat: 24.182960, lng: 121.204100, photo: "assets/photos/nantou/cuiluan.jpg", showPhoto: true },
                    { name: "力行教會", lat: 24.148459, lng: 121.190195, photo: "assets/photos/nantou/lixing.jpg", showPhoto: true },
                    { name: "紅香教會", lat: 24.159071, lng: 121.176026, photo: "assets/photos/nantou/hongxiang.jpg", showPhoto: true },
                    { name: "慈峰教會", lat: 24.131208, lng: 121.184243, photo: "assets/photos/nantou/cifeng.jpg", showPhoto: true },
                    { name: "精英教會", lat: 24.061304, lng: 121.194630, photo: "assets/photos/nantou/jingying.jpg", showPhoto: true },
                    { name: "廬山教會", lat: 24.033899, lng: 121.185267, photo: "assets/photos/nantou/lushan.jpg", showPhoto: true },
                    { name: "春陽教會", lat: 24.027045, lng: 121.149445, photo: "assets/photos/nantou/chunyang.jpg", showPhoto: true }
                ]
            }
        };

        // 全域地圖變數與縮放狀態
        let map = null;
        let mapMarkers = [];
        let currentScale = 0.52; // 預設縮放值適應畫面高度

        // 初始化與縮放控制
        function initScale() {
            const screenHeight = window.innerHeight;
            if (screenHeight < 900) {
                currentScale = 0.48;
            } else if (screenHeight < 1200) {
                currentScale = 0.55;
            } else {
                currentScale = 0.7;
            }
            applyZoom();
        }

        function zoomPoster(delta) {
            currentScale += delta;
            if (currentScale < 0.25) currentScale = 0.25;
            if (currentScale > 1.2) currentScale = 1.2;
            applyZoom();
        }

        function resetZoom() {
            initScale();
        }

        function applyZoom() {
            const poster = document.getElementById('poster');
            poster.style.transform = `scale(${currentScale})`;
            document.getElementById('scale-indicator').innerText = `${Math.round(currentScale * 100)}%`;
        }

        // Initialize Leaflet Map
        function setupLeafletMap() {
            if (map) return;

            // 建立 Leaflet 地圖物件
            map = L.map('leaflet-map', {
                zoomControl: false,
                attributionControl: false,
                dragging: false,
                scrollWheelZoom: false,
                doubleClickZoom: false
            });

            // 載入高解析度地形與行政區地圖圖層 (OpenStreetMap Terrain/Standard Layer)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                subdomains: ['a', 'b', 'c']
            }).addTo(map);
        }

        function renderPoster() {
            const zoneKey = document.getElementById("zone-select").value;
            const zone = zonesData[zoneKey];
            if (!zone) return;

            // 更新標題
            document.getElementById("poster-title").innerText = zone.title;
            document.getElementById("poster-subtitle").innerText = zone.subtitle;
            document.getElementById("map-area-tag").innerHTML = `<i class="fa-solid fa-layer-group"></i> ${zone.name} 地形與行政區地圖`;
            document.getElementById("footer-count-text").innerText = `共收錄 ${zone.churches.length} 所教會`;

            // 清空舊圖層
            const photosContainer = document.getElementById("photos-container");
            const svgLayer = document.getElementById("svg-connections");
            photosContainer.innerHTML = '';
            svgLayer.innerHTML = '';

            // 清除 Leaflet 圖標
            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];

            const churches = zone.churches;
            if (churches.length === 0) return;

            // 1. 設定 Leaflet 地圖邊界 (Fit Bounds)
            const bounds = L.latLngBounds(churches.map(c => [c.lat, c.lng]));
            map.fitBounds(bounds, { padding: [40, 40] });

            // 等待地圖渲染後取得 DOM 座標進行 SVG 動態連線
            setTimeout(() => {
                map.invalidateSize();
                
                // 地圖容器在海報中的偏移量
                // Map container: left 30px, top 880px
                const mapContainerLeft = 30;
                const mapContainerTop = 880;

                // 多欄佈局排列照片泡泡 (放置於海報上半部 180px ~ 820px 區域)
                const photoChurches = churches.filter(c => c.showPhoto);
                const totalPhotos = photoChurches.length;

                // 定義雙欄與錯落分佈位置網格
                photoChurches.forEach((church, index) => {
                    // === 1. 在 Leaflet 上建立地標 (Marker) ===
                    const customIcon = L.divIcon({
                        className: '',
                        html: `
                            <div class="custom-church-pin">
                                <div class="pin-head">
                                    <i class="fa-solid fa-church"></i>
                                </div>
                                <div class="pin-label">${church.name}</div>
                            </div>
                        `,
                        iconSize: [60, 50],
                        iconAnchor: [30, 25]
                    });

                    const marker = L.marker([church.lat, church.lng], { icon: customIcon }).addTo(map);
                    mapMarkers.push(marker);

                    // 取得地標在地圖容器內像素座標
                    const point = map.latLngToContainerPoint([church.lat, church.lng]);
                    const pinX = mapContainerLeft + point.x;
                    const pinY = mapContainerTop + point.y;

                    // === 2. 上半部相片泡泡位置繪製 ===
                    // 計算交錯兩欄或三欄位置
                    const isEven = index % 2 === 0;
                    const colX = isEven ? 130 + (Math.random() * 40 - 20) : 450 + (Math.random() * 40 - 20);
                    
                    // 縱向均勻分佈 (180px ~ 800px)
                    const rowHeight = (620 / Math.ceil(totalPhotos / 2));
                    const rowIndex = Math.floor(index / 2);
                    const photoY = 200 + rowIndex * rowHeight + (Math.random() * 30 - 15);
                    const photoX = colX;

                    // 隨機照片大小 140px ~ 190px
                    const photoSize = 145 + Math.floor(Math.random() * 35);

                    // 創建照片 Bubbles 元素
                    const photoEl = document.createElement("div");
                    photoEl.className = "photo-bubble absolute cursor-pointer pointer-events-auto rounded-full p-1.5 bg-gradient-to-br from-brand-gold/60 via-slate-800 to-amber-700/40 shadow-2xl flex items-center justify-center group";
                    photoEl.style.width = `${photoSize}px`;
                    photoEl.style.height = `${photoSize}px`;
                    photoEl.style.left = `${photoX - photoSize / 2}px`;
                    photoEl.style.top = `${photoY - photoSize / 2}px`;
                    photoEl.style.zIndex = 20 + index;

                    // 內層照片區 (預設縮圖與圖片加載機制)
                    photoEl.innerHTML = `
                        <div class="w-full h-full rounded-full overflow-hidden relative bg-slate-900 border border-brand-gold/40">
                            <img src="${church.photo}" 
                                 alt="${church.name}" 
                                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                                 onerror="this.onerror=null; this.src='https://placehold.co/300x300/1e293b/dfb754?text=${encodeURIComponent(church.name)}';" />
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent opacity-80 group-hover:opacity-40 transition-opacity"></div>
                            <div class="absolute bottom-2 inset-x-0 text-center">
                                <span class="px-2 py-0.5 rounded-full bg-slate-950/80 text-brand-goldLight text-[11px] font-bold tracking-wider border border-brand-gold/30">
                                    ${church.name}
                                </span>
                            </div>
                        </div>
                    `;

                    photosContainer.appendChild(photoEl);

                    // === 3. 繪製連線 SVG (相片泡泡中心 -> 地圖 Pin 點) ===
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    
                    // 控制貝茲曲線的彎曲度
                    const controlX = (photoX + pinX) / 2 + (isEven ? -40 : 40);
                    const controlY = (photoY + pinY) / 2;
                    const pathData = `M ${photoX} ${photoY} Q ${controlX} ${controlY} ${pinX} ${pinY}`;

                    line.setAttribute('d', pathData);
                    line.setAttribute('fill', 'none');
                    line.setAttribute('stroke', 'url(#gold-gradient)');
                    line.setAttribute('stroke-width', '2');
                    line.setAttribute('stroke-dasharray', '6 6');
                    line.setAttribute('opacity', '0.65');

                    // 動畫虛線流動效果
                    const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
                    anim.setAttribute('attributeName', 'stroke-dashoffset');
                    anim.setAttribute('from', '24');
                    anim.setAttribute('to', '0');
                    anim.setAttribute('dur', '2s');
                    anim.setAttribute('repeatCount', 'indefinite');
                    line.appendChild(anim);

                    svgLayer.appendChild(line);
                });

                // 設定 SVG 金色漸層定義
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                defs.innerHTML = `
                    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#F3D685" stop-opacity="0.9" />
                        <stop offset="100%" stop-color="#DFB754" stop-opacity="0.3" />
                    </linearGradient>
                `;
                svgLayer.appendChild(defs);

            }, 300);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setupLeafletMap();
            initScale();
            renderPoster();

            // 視窗調整大小時重新計算縮放
            window.addEventListener('resize', () => {
                applyZoom();
            });
        });
    </script>
</body>
</html>
