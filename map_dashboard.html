            { zone: 'nantou', name: '慈峰', note: '力行線牧區', address: '南投縣仁愛鄉慈峰巷21號', lat: 24.085, lng: 121.165, color: '#f43f5e', bgClass: 'bg-rose-500', textClass: 'text-rose-700' },
            { zone: 'nantou', name: '親愛', note: '親春線牧區', address: '南投縣仁愛鄉親和巷松林17號', lat: 23.951, lng: 121.115, color: '#f43f5e', bgClass: 'bg-rose-500', textClass: 'text-rose-700' },
            { zone: 'nantou', name: '春陽', note: '親春線牧區', address: '南投縣仁愛鄉源泉巷24號', lat: 24.025, lng: 121.162, color: '#f43f5e', bgClass: 'bg-rose-500', textClass: 'text-rose-700' },
            { zone: 'nantou', name: '廬山', note: '親春線牧區', address: '南投縣仁愛鄉富貴路53號', lat: 24.022, lng: 121.185, color: '#f43f5e', bgClass: 'bg-rose-500', textClass: 'text-rose-700' },
            { zone: 'nantou', name: '精英', note: '親春線牧區', address: '南投縣仁愛鄉平靜法治巷31號', lat: 24.035, lng: 121.205, color: '#f43f5e', bgClass: 'bg-rose-500', textClass: 'text-rose-700' },
            { zone: 'nantou', name: '新生', note: '新望愛牧區', address: '南投縣仁愛鄉山林巷眉原182號', lat: 24.062, lng: 120.955, color: '#f43f5e', bgClass: 'bg-rose-500', textClass: 'text-rose-700' },
            { zone: 'nantou', name: '仁愛', note: '新望愛牧區', address: '南投縣埔里鎮青田街42號', lat: 23.965, lng: 120.968, color: '#f43f5e', bgClass: 'bg-rose-500', textClass: 'text-rose-700' },
            { zone: 'nantou', name: '武界', note: '新望愛牧區', address: '南投縣仁愛鄉武安路21號', lat: 23.911, lng: 121.045, color: '#f43f5e', bgClass: 'bg-rose-500', textClass: 'text-rose-700' },
            { zone: 'nantou', name: '望美', note: '新望愛牧區', address: '南投縣信義鄉美信巷3之2號', lat: 23.615, lng: 120.885, color: '#f43f5e', bgClass: 'bg-rose-500', textClass: 'text-rose-700' }
        ];

        // ----------------------------------------------------
        // 2. 地圖初始化設定
        // ----------------------------------------------------
        const map = L.map('map', {
            center: [24.2, 120.9], // 預設視角：西半部中心點
            zoom: 9,
            zoomControl: false // 自訂位置
        });
        
        // 加入右下角縮放控制
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 建立 Google Maps 地形圖圖層
        const googleTerrain = L.tileLayer('https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        // 建立 Google Maps 衛星混合圖層 (包含衛星影像與道路地標)
        const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        // 預設將地形圖加入地圖中 (能清晰呈現山脈起伏且文字易讀)
        googleTerrain.addTo(map);

        // 加入底圖切換控制器，放置於右上角
        L.control.layers({
            "⛰️ Google 地形圖": googleTerrain,
            "🛰️ Google 衛星圖": googleHybrid
        }, null, { position: 'topright' }).addTo(map);

        // 隱藏 Loader
        setTimeout(() => {
            document.getElementById('map-loader').style.opacity = '0';
            setTimeout(() => document.getElementById('map-loader').style.display = 'none', 500);
        }, 800);

        // ----------------------------------------------------
        // 3. 建立自訂旗標 (SVG HTML Icon) 與 Popup 樣板
        // ----------------------------------------------------
        function createFlagIcon(color) {
            return L.divIcon({
                className: 'custom-flag-icon bg-transparent border-0',
                html: `
                    <div class="marker-bounce text-center drop-shadow-md">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="${color}" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                            <line x1="4" y1="22" x2="4" y2="15"></line>
                        </svg>
                    </div>
                `,
                iconSize: [32, 32],
                iconAnchor: [16, 32], // 將錨點設在旗桿底部
                popupAnchor: [0, -32]
            });
        }

        // 建立 Popup 內容結構
        function generatePopupContent(church) {
            return `
                <div class="w-64 bg-white m-0 p-0">
                    <div class="${church.bgClass} px-4 py-3 text-white flex justify-between items-center">
                        <span class="font-black text-lg tracking-wider">${church.name}教會</span>
                        <span class="text-[9px] font-bold bg-white/20 px-2 py-1 rounded-full">${church.note}</span>
                    </div>
                    <div class="p-4 bg-slate-50">
                        <p class="text-xs text-slate-500 font-bold mb-1 uppercase tracking-widest">實體地址</p>
                        <p class="text-sm font-black text-slate-700 leading-snug">${church.address}</p>
                        
                        <div class="mt-4 pt-3 border-t border-slate-200 flex justify-between items-center">
                            <span class="text-[10px] ${church.textClass} font-bold">● TJC 西區小區編制</span>
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(church.address)}" target="_blank" class="text-[10px] bg-slate-800 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-indigo-600 transition-colors">
                                地圖導航 ↗
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        // ----------------------------------------------------
        // 4. 將教會資料分類載入圖層 (LayerGroups)
        // ----------------------------------------------------
        const zoneLayers = {
            fuxing: L.featureGroup(),
            zhumiao: L.featureGroup(),
            zhongmiao: L.featureGroup(),
            nantou: L.featureGroup(),
            all: L.featureGroup() // 用於全覽縮放
        };

        const zoneColors = {
            fuxing: '#f59e0b',   // Amber
            zhumiao: '#10b981',  // Emerald
            zhongmiao: '#a855f7', // Purple
            nantou: '#f43f5e'    // Rose
        };

        // 遍歷資料生成 Marker
        churchesData.forEach(church => {
            const marker = L.marker([church.lat, church.lng], {
                icon: createFlagIcon(church.color)
            }).bindPopup(generatePopupContent(church), {
                closeButton: false,
                className: 'custom-popup'
            });
            
            // 加入對應的圖層組
            zoneLayers[church.zone].addLayer(marker);
            zoneLayers['all'].addLayer(marker); // 全覽用副本
        });

        // 預設在地圖上顯示所有小區
        zoneLayers.fuxing.addTo(map);
        zoneLayers.zhumiao.addTo(map);
        zoneLayers.zhongmiao.addTo(map);
        zoneLayers.nantou.addTo(map);

        // ----------------------------------------------------
        // 5. 繪製牧區地理範圍 (Polygons / Bounding Boxes)
        // ----------------------------------------------------
        // 利用 Leaflet 的 Convex Hull 概念，簡單繪製包含該區標記的圓形或多邊形區域
        const zoneBoundsOverlays = {};
        
        function createZoneOverlay(zoneId) {
            const bounds = zoneLayers[zoneId].getBounds();
            // 繪製一個覆蓋邊界的矩形，設定顏色與透明度以表示「範圍」
            const rect = L.rectangle(bounds, {
                color: zoneColors[zoneId],
                weight: 2,
                dashArray: '5, 10',
                fillColor: zoneColors[zoneId],
                fillOpacity: 0.1
            });
            return rect;
        }

        // ----------------------------------------------------
        // 6. 視角切換功能 (動態濾鏡與縮放)
        // ----------------------------------------------------
        let currentActiveOverlay = null;

        function changeView(zoneId) {
            // 1. 關閉目前所有開啟的彈出視窗
            map.closePopup();

            if (zoneId === 'all') {
                // 如果是全覽，顯示所有點位，移除範圍覆蓋
                ['fuxing', 'zhumiao', 'zhongmiao', 'nantou'].forEach(z => {
                    if (!map.hasLayer(zoneLayers[z])) map.addLayer(zoneLayers[z]);
                });
                if (currentActiveOverlay && map.hasLayer(currentActiveOverlay)) {
                    map.removeLayer(currentActiveOverlay);
                    currentActiveOverlay = null;
                }
                // 飛回全覽視角
                map.flyToBounds(zoneLayers['all'].getBounds(), { padding: [50, 50], duration: 1.5 });
            } else {
                // 如果是單獨小區，隱藏其他小區，只顯示該區點位與範圍覆蓋
                ['fuxing', 'zhumiao', 'zhongmiao', 'nantou'].forEach(z => {
                    if (z === zoneId) {
                        if (!map.hasLayer(zoneLayers[z])) map.addLayer(zoneLayers[z]);
                    } else {
                        if (map.hasLayer(zoneLayers[z])) map.removeLayer(zoneLayers[z]);
                    }
                });

                // 移除舊的範圍圖層，加入新的範圍圖層
                if (currentActiveOverlay && map.hasLayer(currentActiveOverlay)) {
                    map.removeLayer(currentActiveOverlay);
                }
                currentActiveOverlay = createZoneOverlay(zoneId);
                map.addLayer(currentActiveOverlay);

                // 流暢縮放至該區範圍
                map.flyToBounds(zoneLayers[zoneId].getBounds(), { padding: [80, 80], maxZoom: 11, duration: 1.5 });
            }
        }
        
        // 初始化載入時縮放至全區
        setTimeout(() => {
            map.fitBounds(zoneLayers['all'].getBounds(), { padding: [30, 30] });
        }, 1000);

    </script>
</body>
</html>
